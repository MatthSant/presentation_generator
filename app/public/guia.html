<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guia</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body.guidepg { background: var(--canvas, var(--bg-page)); }
    .guidepg .page { max-width: 1140px; margin: 0 auto; padding: 34px 40px 80px; }
    .guidepg .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); background: var(--purple-bg); padding: 6px 12px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 8px; }
    .guidepg .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--purple); }
    .guidepg h1 { font-size: 38px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; margin: 16px 0 0; max-width: 22ch; }
    .guidepg .lead { font-size: 17px; color: var(--gray2); font-weight: 500; line-height: 1.6; max-width: 62ch; margin-top: 14px; }
    .guidepg .actions { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
    .guidepg .btn { display: inline-flex; align-items: center; gap: 9px; padding: 12px 20px; border-radius: var(--r-pill); font: inherit; font-size: 14.5px; font-weight: 700; border: 1px solid var(--border-strong); background: var(--card, #fff); color: var(--fg); cursor: pointer; text-decoration: none; transition: background .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease), box-shadow .15s var(--ease); }
    .guidepg .btn svg { width: 17px; height: 17px; }
    .guidepg .btn:hover { background: var(--surface); transform: translateY(-1px); }
    .guidepg .btn.primary { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 10px 22px -10px rgba(124,58,237,.7); }
    .guidepg .btn.primary:hover { background: var(--purple-600); border-color: var(--purple-600); }
    .guidepg .rule { height: 1px; background: var(--divider); margin: 30px 0 28px; }

    .guidepg .sections { columns: 2; column-gap: 22px; }
    @media (max-width: 880px) { .guidepg .sections { columns: 1; } }
    .guidepg .card { break-inside: avoid; -webkit-column-break-inside: avoid; display: inline-block; width: 100%; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 24px 26px; margin: 0 0 22px; }
    .guidepg .card-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--purple); display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .guidepg .card-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
    .guidepg .sub-h { font-size: 15px; font-weight: 800; letter-spacing: -.01em; color: var(--fg); margin: 20px 0 9px; }
    .guidepg .sub-h:first-of-type { margin-top: 0; }
    .guidepg .gd-p { font-size: 14px; color: var(--gray); line-height: 1.65; margin: 0 0 11px; }
    .guidepg .witly { list-style: none; display: flex; flex-direction: column; gap: 11px; margin: 4px 0 12px; padding: 0; }
    .guidepg .witly li { position: relative; padding-left: 20px; font-size: 14px; color: var(--gray); line-height: 1.55; }
    .guidepg .witly li::before { content: ''; position: absolute; left: 0; top: 7px; width: 8px; height: 8px; border-radius: 2.5px; background: var(--purple); }
    .guidepg .gd-callout { display: flex; gap: 11px; background: var(--purple-bg); border: 1px solid color-mix(in srgb, var(--purple) 20%, transparent); border-radius: var(--r-md); padding: 12px 14px; margin: 8px 0 11px; }
    .guidepg .gd-callout-l { flex-shrink: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--purple); padding-top: 2px; }
    .guidepg .gd-callout-t { font-size: 13.5px; color: var(--fg); line-height: 1.6; }
    .guidepg .gd-p code, .guidepg .witly code, .guidepg .gd-callout code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .88em; background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; color: var(--purple-600); }
    .guidepg .g-empty { color: var(--gray2); padding: 60px 0; text-align: center; }
  </style>
</head>
<body class="guidepg">
  <header class="home-bar" data-sub="Guia" data-back="/"></header>
  <script src="/js/page-chrome.js" defer></script>
  <div class="page" id="g-wrap"></div>

  <script type="module">
    const wrap = document.getElementById('g-wrap');
    const esc = (s) => String(s ?? '');
    const slug = (location.pathname.match(/\/guia\/([^/]+)/)?.[1]
      ? decodeURIComponent(location.pathname.match(/\/guia\/([^/]+)/)[1])
      : new URLSearchParams(location.search).get('slug')) || '';

    const block = (b) => {
      if (b.type === 'sub') return `<h3 class="sub-h">${esc(b.text)}</h3>`;
      if (b.type === 'ul') return `<ul class="witly">${(b.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
      if (b.type === 'callout') return `<div class="gd-callout"><span class="gd-callout-l">${esc(b.label || '')}</span><span class="gd-callout-t">${esc(b.text)}</span></div>`;
      return `<p class="gd-p">${esc(b.text)}</p>`;
    };

    try {
      const guias = (await (await fetch('/guias.json')).json()).guias || [];
      const g = guias.find(x => x.slug === slug) || guias[0];
      if (!g) { wrap.innerHTML = '<div class="g-empty">Guia não encontrado.</div>'; }
      else {
        document.title = `Guia · ${g.title}`;
        const ctaGerar = g.gerar
          ? `<a class="btn primary" href="${esc(g.gerar)}">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
               Criar esta análise</a>`
          : '';
        const ctaMontador = g.montador
          ? `<a class="btn" href="/montador/${encodeURIComponent(g.montador)}">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/><path d="M13.5 6 10.5 18"/></svg>
               Montar a query</a>`
          : '';
        wrap.innerHTML = `
          ${g.tag ? `<span class="eyebrow">${esc(g.tag)}</span>` : ''}
          <h1>${esc(g.title)}</h1>
          <p class="lead">${esc(g.summary || '')}</p>
          <div class="actions">${ctaGerar}${ctaMontador}</div>
          <div class="rule"></div>
          <div class="sections">
            ${(g.sections || []).map(s => `
              <section class="card">
                <h2 class="card-eyebrow">${esc(s.title)}</h2>
                ${(s.blocks || []).map(block).join('')}
              </section>`).join('')}
          </div>`;
      }
    } catch (err) {
      wrap.innerHTML = `<div class="g-empty">Erro ao carregar o guia: ${esc(err.message)}</div>`;
    }
  </script>
</body>
</html>
