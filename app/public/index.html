<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Witly Grimório</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Home — design Witly (escopado em .hm p/ não colidir com globais .btn/.badge) */
    .hm { background: var(--canvas, #fbfbfd); }
    /* navbar */
    .hm .navbar { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 28px; background: var(--card, #fff); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .hm .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
    .hm .brand .mark { width: 38px; height: 38px; border-radius: 10px; background: #fff; border: 1px solid var(--border); display: grid; place-items: center; box-shadow: var(--shadow-sm); flex-shrink: 0; }
    .hm .brand .mark img { height: 24px; width: auto; display: block; }
    .hm .brand .tx b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
    .hm .brand .tx small { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gray2); }
    .hm .navbar .spacer { flex: 1; }
    .hm .meta-count { font-size: 13px; font-weight: 600; color: var(--gray2); white-space: nowrap; }
    .hm .meta-count b { color: var(--fg); font-weight: 800; }
    .hm .vsep { width: 1px; height: 26px; background: var(--divider); }
    .hm .nbtn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 700; border: 1px solid var(--border-strong); background: var(--card, #fff); color: var(--fg); text-decoration: none; cursor: pointer; transition: background .15s, border-color .15s, transform .12s, box-shadow .15s; font-family: inherit; }
    .hm .nbtn svg { width: 16px; height: 16px; }
    .hm .nbtn:hover { background: var(--surface); }
    .hm .nbtn:active { transform: scale(.97); }
    .hm .nbtn.primary { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 8px 18px -8px rgba(124,58,237,.6); }
    .hm .nbtn.primary:hover { background: var(--purple-600); border-color: var(--purple-600); }
    .hm .nbtn.ghost { border-color: transparent; color: var(--gray); }
    .hm .nbtn.ghost:hover { background: var(--surface); color: var(--fg); }
    /* page */
    .hm .page { max-width: 1180px; margin: 0 auto; padding: 44px 28px 80px; }
    .hm .page h1 { font-size: 38px; font-weight: 800; letter-spacing: -.035em; }
    .hm .lead { font-size: 16px; color: var(--gray2); font-weight: 500; margin-top: 8px; }
    .hm .sec-label { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gray2); display: flex; align-items: center; gap: 13px; margin: 38px 0 18px; }
    .hm .sec-label::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
    /* guide cards */
    .hm .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .hm .guide { position: relative; text-align: left; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 22px 22px 20px; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease); }
    /* Aviso de limitação (i): canto sup. direito, âmbar; o texto vem do `limits` do
       guias.json — sem o campo, o badge não aparece. */
    .hm .guide .warn { position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; border-radius: 50%; background: var(--amber-bg); color: var(--amber-text); display: grid; place-items: center; }
    .hm .guide .warn > svg { width: 15px; height: 15px; }
    .hm .guide .warn .tip { position: absolute; top: calc(100% + 8px); right: -4px; width: 244px; background: var(--amber-soft); border: 1px solid var(--amber); color: var(--amber-text); font-size: 12px; font-weight: 600; line-height: 1.5; text-align: left; padding: 9px 11px; border-radius: 9px; box-shadow: var(--shadow-lift); opacity: 0; visibility: hidden; transform: translateY(-3px); transition: opacity .15s var(--ease), visibility .15s var(--ease), transform .15s var(--ease); pointer-events: none; z-index: 5; }
    .hm .guide .warn:hover .tip { opacity: 1; visibility: visible; transform: translateY(0); }
    /* badge de NOVIDADE (verde) — mesmo mecanismo do warn, tokens verdes; campo
       `news` no guias.json. Se um card um dia tiver os dois, o news desliza p/ a esq. */
    .hm .guide .news { position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; border-radius: 50%; background: var(--green-bg); color: var(--green-text); display: grid; place-items: center; }
    .hm .guide .news > svg { width: 15px; height: 15px; }
    .hm .guide .warn + .news { right: 46px; }
    .hm .guide .news .tip { position: absolute; top: calc(100% + 8px); right: -4px; width: 244px; background: var(--green-soft); border: 1px solid var(--green-text); color: var(--green-text); font-size: 12px; font-weight: 600; line-height: 1.5; text-align: left; padding: 9px 11px; border-radius: 9px; box-shadow: var(--shadow-lift); opacity: 0; visibility: hidden; transform: translateY(-3px); transition: opacity .15s var(--ease), visibility .15s var(--ease), transform .15s var(--ease); pointer-events: none; z-index: 5; }
    .hm .guide .news:hover .tip { opacity: 1; visibility: visible; transform: translateY(0); }
    .hm .guide:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); border-color: var(--purple-300, #c3a4f7); }
    .hm .guide .ic { width: 44px; height: 44px; padding: 0; border-radius: 12px; background: var(--purple-bg); color: var(--purple); display: grid; place-items: center; margin-bottom: 16px; transition: background .2s, color .2s; }
    .hm .guide .ic svg { width: 22px; height: 22px; }
    .hm .guide:hover .ic { background: var(--purple); color: #fff; }
    .hm .guide h3 { font-size: 17px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
    .hm .guide p { font-size: 13.5px; color: var(--gray); line-height: 1.55; margin-top: 9px; flex: 1; }
    .hm .guide .go { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--purple); margin-top: 16px; opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .2s; }
    .hm .guide .go svg { width: 15px; height: 15px; }
    .hm .guide:hover .go { opacity: 1; transform: none; }
    /* recent cards */
    .hm .rcard { position: relative; text-align: left; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 22px 24px; display: flex; flex-direction: column; min-height: 172px; text-decoration: none; color: inherit; transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease); }
    /* Menu de opções (⋯) do card — vive DENTRO do <a>, então cada handler dá
       preventDefault p/ não navegar pro relatório ao usar o menu. */
    .hm .rmenu { position: absolute; top: 14px; right: 14px; }
    .hm .rmenu-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--gray2); display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .15s var(--ease), background .15s var(--ease), color .15s var(--ease); }
    .hm .rcard:hover .rmenu-btn, .hm .rmenu-btn:focus-visible, .hm .rmenu.open .rmenu-btn { opacity: 1; }
    .hm .rmenu-btn:hover, .hm .rmenu.open .rmenu-btn { background: var(--surface); border-color: var(--border); color: var(--fg); }
    .hm .rmenu-btn svg { width: 17px; height: 17px; }
    .hm .rmenu-pop { position: absolute; top: calc(100% + 6px); right: 0; min-width: 168px; background: var(--card, #fff); border: 1px solid var(--border); border-radius: 11px; box-shadow: var(--shadow-lift); padding: 5px; z-index: 30; display: none; }
    .hm .rmenu.open .rmenu-pop { display: block; }
    .hm .rmenu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); cursor: pointer; text-align: left; }
    .hm .rmenu-item:hover { background: var(--surface); }
    .hm .rmenu-item svg { width: 15px; height: 15px; color: var(--gray2); }
    .hm .rmenu-item.danger { color: var(--amber-text); }
    .hm .rmenu-item.danger svg { color: var(--amber-text); }
    .hm .rmenu-item.danger:hover { background: var(--amber-bg); }
    .hm .rcard:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); border-color: var(--purple-300, #c3a4f7); }
    .hm .rbadge { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; padding: 5px 11px; border-radius: var(--r-pill); background: var(--purple-bg); color: var(--purple); }
    .hm .rbadge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); }
    .hm .rcard h3 { font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin-top: 14px; flex: 1; }
    .hm .rcard .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--divider); }
    .hm .rcard .slug { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: var(--gray2); font-weight: 500; }
    .hm .rcard .date { font-size: 12.5px; color: var(--gray2); font-weight: 600; }
    /* client cards */
    .hm .ccard { display: flex; align-items: center; gap: 15px; text-align: left; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 18px 20px; text-decoration: none; color: inherit; transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease); }
    .hm .ccard:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); border-color: var(--purple-300, #c3a4f7); }
    .hm .ccard .av { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 17px; font-weight: 800; color: #fff; flex-shrink: 0; background: linear-gradient(135deg, var(--purple), #9a63f5); }
    .hm .ccard .av.c2 { background: linear-gradient(135deg, var(--plum), var(--purple-600)); }
    .hm .ccard .info { flex: 1; min-width: 0; }
    .hm .ccard .info b { display: block; font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; }
    .hm .ccard .info .slug { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: var(--gray2); font-weight: 500; }
    .hm .ccard .count { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--gray); background: var(--surface); border: 1px solid var(--border); padding: 5px 11px; border-radius: var(--r-pill); flex-shrink: 0; white-space: nowrap; }
    .hm .ccard .count b { color: var(--purple); font-weight: 800; }
    .hm .ccard.add { justify-content: center; gap: 10px; border-style: dashed; border-color: var(--border-strong); box-shadow: none; color: var(--gray2); font-size: 14px; font-weight: 700; cursor: pointer; }
    .hm .ccard.add:hover { color: var(--purple); border-color: var(--purple-300, #c3a4f7); background: var(--purple-bg); transform: translateY(-3px); }
    .hm .ccard.add svg { width: 18px; height: 18px; }
    /* new-analysis dropdown */
    /* Modal Nova análise */
    .scrim { position: fixed; inset: 0; background: rgba(28,16,46,.5); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); z-index: 50; display: grid; place-items: center; padding: 28px; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .modal { width: 620px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; background: var(--card, #fff); border-radius: var(--r-lg); box-shadow: var(--shadow-lift); transform: translateY(14px) scale(.98); opacity: 0; transition: transform .28s var(--ease), opacity .28s var(--ease); overflow: hidden; }
    .scrim.open .modal { transform: none; opacity: 1; }
    .m-hd { display: flex; align-items: flex-start; gap: 14px; padding: 22px 26px 18px; border-bottom: 1px solid var(--border); }
    .m-hd .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); }
    .m-hd h2 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin-top: 5px; }
    .m-hd .grow { flex: 1; }
    .m-close { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--card, #fff); color: var(--gray2); display: grid; place-items: center; flex-shrink: 0; transition: all .15s; cursor: pointer; }
    .m-close svg { width: 17px; height: 17px; }
    .m-close:hover { color: var(--fg); border-color: var(--border-strong); background: var(--surface); }
    .m-body { padding: 20px 26px; overflow-y: auto; }
    .m-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 26px; border-top: 1px solid var(--border); background: var(--surface); }
    .m-foot .hint { font-size: 12.5px; color: var(--gray2); font-weight: 600; }
    .type-opt { width: 100%; text-align: left; display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--card, #fff); margin-bottom: 10px; transition: border-color .15s, box-shadow .15s, background .15s; cursor: pointer; }
    .type-opt:last-child { margin-bottom: 0; }
    .type-opt:hover { border-color: var(--purple-300, #c3a4f7); background: var(--purple-bg); }
    .type-opt.sel { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple), var(--shadow-card); background: var(--purple-bg); }
    .type-opt .ic { width: 38px; height: 38px; padding: 0; border-radius: 10px; background: var(--purple-bg); color: var(--purple); display: grid; place-items: center; flex-shrink: 0; }
    .type-opt.sel .ic { background: var(--purple); color: #fff; }
    .type-opt .ic svg { width: 19px; height: 19px; }
    .type-opt .t b { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    .type-opt .t p { font-size: 13px; color: var(--gray); line-height: 1.5; margin-top: 3px; }
    .type-opt .chk { margin-left: auto; align-self: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; flex-shrink: 0; color: #fff; transition: all .15s; }
    .type-opt .chk svg { width: 13px; height: 13px; opacity: 0; }
    .type-opt.sel .chk { background: var(--purple); border-color: var(--purple); }
    .type-opt.sel .chk svg { opacity: 1; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .hm .home-empty { border: 1px dashed var(--border-strong); border-radius: var(--r-lg); padding: 52px 24px; text-align: center; color: var(--gray); line-height: 1.7; }
    .hm .home-empty code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; background: var(--surface); border: 1px solid var(--border); padding: 2px 6px; border-radius: 5px; color: var(--fg); }
    /* welcome (primeiro acesso, sem análise) */
    .hm .welcome-hero { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 34px 34px 32px; background: linear-gradient(135deg, color-mix(in srgb, var(--purple) 8%, var(--bg)), var(--bg) 62%); }
    .hm .welcome-hero::after { content: ''; position: absolute; top: -60px; right: -40px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--purple) 16%, transparent), transparent 68%); pointer-events: none; }
    .hm .wh-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--purple); background: var(--purple-bg); border-radius: var(--r-pill); padding: 6px 13px; }
    .hm .welcome-hero h2 { font-size: 27px; font-weight: 800; letter-spacing: -.03em; margin: 15px 0 0; max-width: 620px; line-height: 1.15; }
    .hm .welcome-hero p { font-size: 15px; color: var(--gray); line-height: 1.6; margin: 11px 0 0; max-width: 620px; }
    .hm .wh-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    .hm .wh-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; border-radius: 10px; padding: 11px 18px; cursor: pointer; text-decoration: none; border: 1px solid transparent; }
    .hm .wh-btn svg { width: 17px; height: 17px; }
    .hm .wh-btn.primary { color: #fff; background: var(--purple); box-shadow: 0 3px 12px rgba(124,58,237,.3); }
    .hm .wh-btn.primary:hover { background: var(--purple-600); }
    .hm .wh-btn.ghost { color: var(--fg); background: var(--bg); border-color: var(--border-strong); }
    .hm .wh-btn.ghost:hover { border-color: var(--purple-300, #c3a4f7); color: var(--purple); }
    /* card de tipo (grid de criação) — variante clicável do guide */
    .hm .tcard { position: relative; text-align: left; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 20px 20px 18px; display: flex; flex-direction: column; text-decoration: none; color: inherit; cursor: pointer; transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease); }
    .hm .tcard:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); border-color: var(--purple-300, #c3a4f7); }
    .hm .tcard .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--purple-bg); color: var(--purple); display: grid; place-items: center; margin-bottom: 14px; transition: background .2s, color .2s; }
    .hm .tcard .ic svg { width: 20px; height: 20px; }
    .hm .tcard:hover .ic { background: var(--purple); color: #fff; }
    .hm .tcard h3 { font-size: 15.5px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
    .hm .tcard p { font-size: 13px; color: var(--gray); line-height: 1.5; margin-top: 7px; flex: 1; }
    .hm .tcard .go { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--purple); margin-top: 14px; opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .2s; }
    .hm .tcard .go svg { width: 14px; height: 14px; }
    .hm .tcard:hover .go { opacity: 1; transform: none; }
    /* tour guiado (coach-marks) */
    .tour-catch { position: fixed; inset: 0; z-index: 9000; }
    .tour-spot { position: fixed; z-index: 9001; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(15,12,25,.58), 0 0 0 3px var(--purple); pointer-events: none; transition: all .25s var(--ease); }
    .tour-pop { position: fixed; z-index: 9002; width: 300px; max-width: calc(100vw - 32px); background: var(--bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.28); padding: 17px 18px 15px; transition: top .25s var(--ease), left .25s var(--ease); }
    .tour-pop .tp-step { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--purple); }
    .tour-pop h4 { font-size: 16px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 0; }
    .tour-pop p { font-size: 13.5px; color: var(--gray); line-height: 1.55; margin: 8px 0 0; }
    .tour-pop .tp-foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    .tour-pop .tp-dots { display: flex; gap: 5px; margin-right: auto; }
    .tour-pop .tp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
    .tour-pop .tp-dot.on { background: var(--purple); }
    .tour-pop button { font: inherit; font-size: 13px; font-weight: 700; border-radius: 8px; padding: 7px 13px; cursor: pointer; border: 1px solid transparent; }
    .tour-pop .tp-skip { margin-right: auto; background: none; color: var(--gray2); padding: 7px 4px; }
    .tour-pop .tp-skip:hover { color: var(--fg); }
    .tour-pop .tp-back { background: var(--bg); border-color: var(--border-strong); color: var(--fg); }
    .tour-pop .tp-next { background: var(--purple); color: #fff; }
    .tour-pop .tp-next:hover { background: var(--purple-600); }
    @media (max-width: 980px) { .hm .grid3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .hm .grid3 { grid-template-columns: 1fr; } .hm .navbar { padding: 0 16px; } .hm .page { padding: 28px 16px 70px; } }
  </style>
</head>
<body class="hm">
  <nav class="navbar">
    <a class="brand" href="/" title="Início">
      <span class="mark"><img src="/assets/witly-logo.png" alt="Witly" /></span>
      <span class="tx"><b>Witly Grimório</b><small>Analytics</small></span>
    </a>
    <span class="spacer"></span>
    <span class="meta-count" id="bar-count"></span>
    <span class="vsep"></span>
    <a class="nbtn ghost" href="/config.html" title="Clientes, uso, benchmarks e manutenção"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Configurações</a>
    <div class="new-wrap">
      <button class="nbtn primary" id="new-btn" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Nova análise</button>
    </div>

    <div class="scrim" id="new-modal" role="dialog" aria-modal="true" aria-labelledby="nm-title">
      <div class="modal">
        <div class="m-hd">
          <div class="grow">
            <div class="eyebrow">Nova análise</div>
            <h2 id="nm-title">Que tipo de análise você quer criar?</h2>
          </div>
          <button class="m-close" id="nm-close" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="m-body"><div class="pane show" id="nm-types"></div></div>
        <div class="m-foot">
          <span class="hint" id="nm-hint">Selecione um tipo para continuar.</span>
          <button class="nbtn primary" id="nm-next" type="button" disabled>Continuar</button>
        </div>
      </div>
    </div>
    <button class="nbtn ghost" id="logout" type="button" title="Sair" style="display:none"></button>
  </nav>

  <div class="page">
    <h1>Análises</h1>
    <p class="lead">Selecione um relatório para abrir o dashboard, ou crie uma nova análise.</p>
    <section id="sec-guias" hidden>
      <div class="sec-label">Guias</div>
      <div class="grid3" id="guia-grid"></div>
    </section>
    <main id="home-list"></main>
  </div>

  <script type="module">
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const initials = (name) => String(name || '?').split(/[-\s_]+/).map(s => s[0] || '').join('').slice(0, 2).toUpperCase() || '?';
    const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"/></svg>';
    const TYPE_LABEL = { 'acompanhamento-lancamento': 'Acompanhamento', 'debriefing-lancamento': 'Debriefing', 'historico-lancamentos': 'Histórico', 'conversao-perfil': 'Conversão', 'criativos': 'Criativos', dashboard: 'Dashboard', ltv: 'LTV' };

    // Ícone por tipo de análise (mesmo da modal Nova análise); fallback = livro.
    const SW = 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
    const TYPE_ICON = {
      'conversao-perfil': `<svg viewBox="0 0 24 24" ${SW}><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>`,
      'historico-lancamentos': `<svg viewBox="0 0 24 24" ${SW}><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>`,
      'criativos': `<svg viewBox="0 0 24 24" ${SW}><path d="M2 7l4-4h12l4 4M2 7v13a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V7M2 7h20M10 11a2 2 0 0 0 4 0"/></svg>`,
      'acompanhamento-lancamento': `<svg viewBox="0 0 24 24" ${SW}><path d="M3 3v18h18"/><path d="M7 16l3-3 2 2 5-6"/><circle cx="17" cy="9" r="1.4"/></svg>`,
      'debriefing-lancamento': `<svg viewBox="0 0 24 24" ${SW}><path d="M3 3v18h18"/><rect x="7" y="11" width="2.5" height="7"/><rect x="12" y="7" width="2.5" height="11"/><rect x="17" y="14" width="2.5" height="4"/></svg>`,
    };
    const BOOK = `<svg viewBox="0 0 24 24" ${SW}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>`;
    const INFO = `<svg viewBox="0 0 24 24" ${SW}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`;
    const SPARK = `<svg viewBox="0 0 24 24" ${SW}><path d="M12 3l1.9 5.2L19 10l-5.1 1.8L12 17l-1.9-5.2L5 10l5.1-1.8z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>`;
    const DOTS = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>`;
    const IC_UPD = `<svg viewBox="0 0 24 24" ${SW}><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>`;
    const IC_REN = `<svg viewBox="0 0 24 24" ${SW}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
    const IC_ARC = `<svg viewBox="0 0 24 24" ${SW}><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>`;

    // Nova análise → modal de escolha do tipo
    const NEW_TYPES = [
      { slug: 'acompanhamento-lancamento', title: 'Acompanhamento de Campanha', desc: 'Report tático diário: metas, tendência 3 dias, riscos e funil.', href: '/gerar-acompanhamento.html' },
      { slug: 'debriefing-lancamento', title: 'Debriefing de Lançamento', desc: 'Dashboard pós-campanha: resultado, canais, mídia e Análise 360°.', href: '/gerar-debriefing.html' },
      { slug: 'criativos', title: 'Análise de Criativos', desc: 'Desempenho anúncio a anúncio: ROAS, captação e qualidade.', href: '/gerar-criativos.html' },
      { slug: 'conversao-perfil', title: 'Conversão por Perfil', desc: 'Quais perfis de lead convertem ao longo dos lançamentos.', href: '/gerar.html' },
      { slug: 'historico-lancamentos', title: 'Histórico de Lançamentos', desc: 'Evolução de conversão, mídia e reembolso entre eventos.', href: '/gerar-historico.html' },
    ];
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    const newBtn = document.getElementById('new-btn');
    const newModal = document.getElementById('new-modal');
    const nmClose = document.getElementById('nm-close');
    const nmTypes = document.getElementById('nm-types');
    const nmHint = document.getElementById('nm-hint');
    const nmNext = document.getElementById('nm-next');
    let chosen = null;
    nmTypes.innerHTML = NEW_TYPES.map(t => `
      <button class="type-opt" type="button" data-href="${t.href}" data-title="${esc(t.title)}">
        <span class="ic">${TYPE_ICON[t.slug] || BOOK}</span>
        <span class="t"><b>${esc(t.title)}</b><p>${esc(t.desc)}</p></span>
        <span class="chk">${CHECK}</span>
      </button>`).join('');
    nmTypes.querySelectorAll('.type-opt').forEach(o => o.addEventListener('click', () => {
      nmTypes.querySelectorAll('.type-opt').forEach(x => x.classList.remove('sel'));
      o.classList.add('sel');
      chosen = o.dataset.href;
      nmHint.textContent = o.dataset.title;
      nmNext.disabled = false;
    }));
    const openModal = () => { newModal.classList.add('open'); };
    const closeModal = () => {
      newModal.classList.remove('open');
      chosen = null; nmNext.disabled = true; nmHint.textContent = 'Selecione um tipo para continuar.';
      nmTypes.querySelectorAll('.type-opt').forEach(x => x.classList.remove('sel'));
    };
    newBtn?.addEventListener('click', openModal);
    nmClose.addEventListener('click', closeModal);
    newModal.addEventListener('click', e => { if (e.target === newModal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && newModal.classList.contains('open')) closeModal(); });
    nmNext.addEventListener('click', () => { if (chosen) location.href = chosen; });
    const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';

    // Primeiro acesso (sem nenhuma análise): hero de boas-vindas + os tipos como
    // cards de criação. A seção de Guias separada é redundante aqui — os cards de
    // tipo já apresentam cada análise — então some.
    function renderWelcome(list) {
      const guiasSec = document.getElementById('sec-guias');
      if (guiasSec) guiasSec.hidden = true;
      const lead = document.querySelector('.hm .lead');
      if (lead) lead.textContent = 'Você ainda não tem análises. Crie a primeira em segundos.';
      const cards = NEW_TYPES.map(t => `
        <a class="tcard" href="${t.href}">
          <span class="ic">${TYPE_ICON[t.slug] || BOOK}</span>
          <h3>${esc(t.title)}</h3>
          <p>${esc(t.desc)}</p>
          <span class="go">Criar ${ARROW}</span>
        </a>`).join('');
      list.innerHTML = `
        <div class="welcome-hero">
          <span class="wh-eyebrow">Comece por aqui</span>
          <h2>Vamos criar sua primeira análise</h2>
          <p>O Witly Grimório transforma seus dados de campanha em dashboards prontos para o cliente — com achados, aprofundamentos por IA e exportação. Escolha um tipo abaixo para começar.</p>
          <div class="wh-actions">
            <button class="wh-btn primary" type="button" onclick="document.getElementById('new-btn').click()">${PLUS}Nova análise</button>
            <button class="wh-btn ghost" type="button" id="wh-tour">Fazer o tour</button>
          </div>
        </div>
        <div class="sec-label">Tipos de análise</div>
        <div class="grid3">${cards}</div>`;
    }

    // Guias
    try {
      const guias = ((await (await fetch('/guias.json')).json()).guias) || [];
      if (guias.length) {
        document.getElementById('sec-guias').hidden = false;
        document.getElementById('guia-grid').innerHTML = guias.map(g => `
          <a class="guide" href="/guia/${encodeURIComponent(g.slug)}">
            ${g.limits ? `<span class="warn" aria-label="Limitações desta análise">${INFO}<span class="tip">${esc(g.limits)}</span></span>` : ''}
            ${g.news ? `<span class="news" aria-label="Novidade nesta análise">${SPARK}<span class="tip">${esc(g.news)}</span></span>` : ''}
            <span class="ic">${TYPE_ICON[g.slug] || BOOK}</span>
            <h3>${esc(g.title)}</h3>
            <p>${esc(g.summary || '')}</p>
            <span class="go">Abrir guia ${ARROW}</span>
          </a>`).join('');
      }
    } catch { /* guias.json ausente */ }

    const list = document.getElementById('home-list');
    try {
      const res = await fetch('/api/analyses');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();
      if (!rows.length) {
        renderWelcome(list);
      } else {
        const groups = new Map();
        for (const r of rows) { if (!groups.has(r.client)) groups.set(r.client, { name: r.clientName || r.client, slug: r.client, items: [] }); groups.get(r.client).items.push(r); }
        const ordered = [...groups.values()].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
        const nAn = rows.length, nCli = ordered.length;
        document.getElementById('bar-count').innerHTML = `<b>${nAn}</b> ${nAn === 1 ? 'análise' : 'análises'} · <b>${nCli}</b> ${nCli === 1 ? 'cliente' : 'clientes'}`;

        const rcard = (r) => `
          <a class="rcard" href="/report/${encodeURIComponent(r.client)}/${encodeURIComponent(r.slug)}" data-client="${esc(r.client)}" data-slug="${esc(r.slug)}">
            <span class="rbadge"><span class="dot"></span>${esc(TYPE_LABEL[r.type] || r.type || 'Relatório')}</span>
            <span class="rmenu">
              <button class="rmenu-btn" type="button" aria-label="Opções da análise" aria-haspopup="menu">${DOTS}</button>
              <span class="rmenu-pop" role="menu">
                <button class="rmenu-item" type="button" data-act="update" role="menuitem">${IC_UPD}Atualizar</button>
                <button class="rmenu-item" type="button" data-act="rename" role="menuitem">${IC_REN}Renomear</button>
                <button class="rmenu-item danger" type="button" data-act="archive" role="menuitem">${IC_ARC}Descartar</button>
              </span>
            </span>
            <h3>${esc(r.title || r.slug)}</h3>
            <div class="foot"><span class="slug">${esc(r.client)}</span><span class="date">${esc(fmtDate(r.created_at))}</span></div>
          </a>`;
        const ccard = (g, i) => `
          <a class="ccard" href="/cliente/${encodeURIComponent(g.slug)}">
            <span class="av ${i % 2 ? 'c2' : ''}">${esc(initials(g.name))}</span>
            <span class="info"><b>${esc(g.name)}</b><span class="slug">${esc(g.slug)}</span></span>
            <span class="count"><b>${g.items.length}</b> ${g.items.length === 1 ? 'análise' : 'análises'}</span>
          </a>`;
        const recent = [...rows].sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || ''))).slice(0, 6);
        list.innerHTML = `
          <section><div class="sec-label">Recentes</div><div class="grid3">${recent.map(rcard).join('')}</div></section>
          <section><div class="sec-label">Clientes</div><div class="grid3">${ordered.map(ccard).join('')}
            <button class="ccard add" type="button" onclick="document.getElementById('new-btn').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Nova análise</button>
          </div></section>`;
      }
    } catch (err) { list.innerHTML = `<div class="home-empty">Erro ao carregar análises: ${esc(err.message)}</div>`; }

    // ── Menu de opções dos cards (delegação: a lista é re-renderizada) ─────────
    const closeMenus = (except) => document.querySelectorAll('.rmenu.open').forEach((m) => { if (m !== except) m.classList.remove('open'); });
    document.addEventListener('click', (e) => {
      const btn = e.target.closest?.('.rmenu-btn');
      const item = e.target.closest?.('.rmenu-item');
      if (!btn && !item) { closeMenus(); return; }
      // O menu vive dentro do <a> do card: sem isso, qualquer clique abriria o relatório.
      e.preventDefault(); e.stopPropagation();
      if (btn) { const m = btn.closest('.rmenu'); const wasOpen = m.classList.contains('open'); closeMenus(m); m.classList.toggle('open', !wasOpen); return; }
      closeMenus();
      const card = item.closest('.rcard');
      const client = card.dataset.client, slug = card.dataset.slug;
      const title = card.querySelector('h3').textContent;
      const act = item.dataset.act;
      if (act === 'update') { location.href = `/atualizar.html?client=${encodeURIComponent(client)}&slug=${encodeURIComponent(slug)}`; return; }
      if (act === 'rename') { void renameAnalysis(client, slug, title, card); return; }
      if (act === 'archive') { void archiveAnalysis(client, slug, title, card); return; }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });

    async function renameAnalysis(client, slug, current, card) {
      const title = prompt('Novo nome da análise:', current);
      if (title === null) return;                       // cancelou
      if (!title.trim() || title.trim() === current) return;
      const r = await fetch(`/api/${encodeURIComponent(client)}/${encodeURIComponent(slug)}/rename`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title.trim() }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert('Não deu para renomear: ' + (d.error || `HTTP ${r.status}`)); return; }
      card.querySelector('h3').textContent = d.title;   // sem reload: troca o rótulo no lugar
    }

    async function archiveAnalysis(client, slug, title, card) {
      // Arquivar é REVERSÍVEL (some da home, o relatório segue na URL) — por isso o
      // confirm é leve e o texto diz onde restaurar, em vez de assustar.
      if (!confirm(`Descartar "${title}"?\n\nEla sai da home, mas não é apagada — dá para restaurar em Configurações.`)) return;
      const r = await fetch('/api/archive', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ client, slug }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert('Não deu para descartar: ' + (d.error || `HTTP ${r.status}`)); return; }
      card.remove();
    }

    // ── Tour guiado (coach-marks) ────────────────────────────────────────────
    const TOUR_KEY = 'witly_tour_v1';
    const TOUR_STEPS = [
      { sel: '#new-btn', title: 'Crie uma análise', text: 'Todo relatório começa aqui: escolha o tipo, suba o CSV e o Witly monta o dashboard pronto para o cliente.' },
      { sel: 'a[href="/config.html"]', title: 'Clientes e configurações', text: 'Cadastre clientes, ajuste benchmarks e acompanhe o uso da IA. Administradores também criam usuários por aqui.' },
      { sel: '.welcome-hero .grid3, #home-list .grid3', title: 'Os tipos de análise', text: 'Cada tipo responde uma pergunta diferente — acompanhamento, debriefing, criativos, conversão e histórico. Abra o guia de cada um quando quiser.' },
    ];

    function startTour() {
      // Passos cujo alvo não existe nesta tela são pulados (ex.: sem o grid de tipos).
      const steps = TOUR_STEPS.map(s => ({ ...s, el: document.querySelector(s.sel) })).filter(s => s.el);
      if (!steps.length) return;
      let i = 0;
      const back = document.createElement('div'); back.className = 'tour-catch';
      const spot = document.createElement('div'); spot.className = 'tour-spot';
      const pop = document.createElement('div'); pop.className = 'tour-pop';
      document.body.append(back, spot, pop);
      const finish = () => {
        localStorage.setItem(TOUR_KEY, 'done');
        [back, spot, pop].forEach(n => n.remove());
        removeEventListener('resize', reposition); removeEventListener('scroll', reposition, true);
      };
      back.addEventListener('click', finish);   // clicar fora encerra
      function reposition() {
        const r = steps[i].el.getBoundingClientRect(), pad = 6;
        spot.style.top = (r.top - pad) + 'px'; spot.style.left = (r.left - pad) + 'px';
        spot.style.width = (r.width + pad * 2) + 'px'; spot.style.height = (r.height + pad * 2) + 'px';
        const pw = 300, gap = 12;
        let top = r.bottom + gap;
        if (top + 170 > innerHeight) top = Math.max(gap, r.top - 170 - gap);
        pop.style.top = top + 'px';
        pop.style.left = Math.min(Math.max(12, r.left), innerWidth - pw - 12) + 'px';
      }
      function render() {
        const st = steps[i], last = i === steps.length - 1;
        const dots = steps.map((_, k) => `<span class="tp-dot ${k === i ? 'on' : ''}"></span>`).join('');
        pop.innerHTML = `
          <div class="tp-step">Passo ${i + 1} de ${steps.length}</div>
          <h4>${esc(st.title)}</h4>
          <p>${esc(st.text)}</p>
          <div class="tp-foot">
            <div class="tp-dots">${dots}</div>
            ${i > 0 ? '<button class="tp-back" type="button">Voltar</button>' : '<button class="tp-skip" type="button">Pular</button>'}
            <button class="tp-next" type="button">${last ? 'Concluir' : 'Próximo'}</button>
          </div>`;
        pop.querySelector('.tp-next').onclick = () => { if (last) finish(); else goto(i + 1); };
        const b = pop.querySelector('.tp-back'); if (b) b.onclick = () => goto(i - 1);
        const s = pop.querySelector('.tp-skip'); if (s) s.onclick = finish;
        reposition();
      }
      function goto(n) { i = n; steps[i].el.scrollIntoView({ block: 'center' }); render(); }
      goto(0);
      addEventListener('resize', reposition); addEventListener('scroll', reposition, true);
    }

    // Reabrir pelo botão do welcome; auto-abrir uma vez no primeiro acesso.
    document.getElementById('wh-tour')?.addEventListener('click', startTour);
    if (!localStorage.getItem(TOUR_KEY)) setTimeout(startTour, 650);
  </script>
  <script>
    fetch('/auth/me').then(r => r.ok ? r.json() : null).then(me => {
      if (!me) return;
      const b = document.getElementById('logout');
      b.innerHTML = `<b>${me.email}</b> · Sair`;
      b.style.display = 'inline-flex';
      b.onclick = async () => { await fetch('/auth/logout', { method: 'POST' }); location.href = '/login.html'; };
    }).catch(() => {});
  </script>
</body>
</html>
