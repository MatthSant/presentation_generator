<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Dossiê do Consultor</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: var(--bg-page); display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .lg-card { width: 360px; max-width: 92vw; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.12); padding: 30px 28px; }
    .lg-logo { height: 22px; width: auto; display: block; margin-bottom: 18px; }
    .lg-title { font-size: 20px; font-weight: 750; letter-spacing: -.02em; margin: 0 0 4px; }
    .lg-sub { font-size: 13px; color: var(--gray); margin: 0 0 20px; }
    .lg-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
    .lg-field label { font-size: 12px; font-weight: 700; color: var(--fg); }
    .lg-field input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: 'Exo 2', sans-serif; font-size: 14px; color: var(--fg); outline: none; }
    .lg-field input:focus { border-color: var(--purple); }
    .lg-btn { width: 100%; margin-top: 6px; font-size: 14px; font-weight: 800; color: #fff; background: var(--purple); border: none; border-radius: 9px; padding: 11px; cursor: pointer; box-shadow: 0 3px 12px rgba(124,58,237,.3); }
    .lg-btn:disabled { opacity: .55; cursor: not-allowed; }
    .lg-err { display: none; margin-top: 12px; font-size: 13px; color: var(--fg); background: color-mix(in srgb, var(--red) 9%, var(--bg)); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); border-radius: 8px; padding: 9px 12px; }
    .lg-err.show { display: block; }
  </style>
</head>
<body>
  <form class="lg-card" id="lg">
    <img class="lg-logo" src="/assets/witly-logo.png" alt="Witly" />
    <h1 class="lg-title">Entrar</h1>
    <p class="lg-sub">Acesse suas análises.</p>
    <div class="lg-field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required /></div>
    <div class="lg-field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required /></div>
    <button class="lg-btn" id="btn" type="submit">Entrar</button>
    <div class="lg-err" id="err"></div>
  </form>
  <script type="module">
    const form = document.getElementById('lg');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        const res = await fetch('/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(d.error || 'falha ao entrar');
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.href = next;
      } catch (e2) {
        err.textContent = e2.message; err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
