<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cliente</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body.clientpg { background: var(--canvas, var(--bg-page)); }
    .clientpg .page { max-width: 1140px; margin: 0 auto; padding: 28px 32px 90px; }
    .clientpg .crumbs { display: flex; align-items: center; gap: 9px; font-size: 13.5px; margin-bottom: 24px; }
    .clientpg .crumbs a { color: var(--gray2); text-decoration: none; font-weight: 600; }
    .clientpg .crumbs a:hover { color: var(--fg); }
    .clientpg .crumbs .sl { color: var(--faint); }
    .clientpg .crumbs .cur { color: var(--fg); font-weight: 700; }

    .clientpg .chead { display: flex; align-items: center; gap: 18px; }
    .clientpg .chead .av { width: 62px; height: 62px; border-radius: 17px; display: grid; place-items: center; font-size: 25px; font-weight: 800; color: #fff; flex-shrink: 0; background: linear-gradient(135deg, var(--plum, #2E084B), var(--purple)); }
    .clientpg .chead .id { flex: 1; min-width: 0; }
    .clientpg .chead .id h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
    .clientpg .chead .id .slug { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px; color: var(--gray2); margin-top: 4px; }

    .clientpg .stats { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .clientpg .stat { display: flex; align-items: center; gap: 12px; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-card); padding: 12px 16px; }
    .clientpg .stat .si { width: 34px; height: 34px; border-radius: 9px; background: var(--purple-bg); color: var(--purple); display: grid; place-items: center; flex-shrink: 0; }
    .clientpg .stat .si svg { width: 17px; height: 17px; }
    .clientpg .stat .sv b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
    .clientpg .stat .sv small { font-size: 11.5px; color: var(--gray2); font-weight: 600; }

    .clientpg .about { background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 22px 24px; margin-top: 22px; }
    .clientpg .about-hd { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .clientpg .about-hd b { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--purple); }
    .clientpg .about-hd .rule { flex: 1; height: 1px; background: var(--divider); }
    .clientpg .edit-link { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; font-weight: 700; color: var(--gray); background: var(--surface); border: 1px solid var(--border); padding: 7px 13px; border-radius: var(--r-pill); cursor: pointer; transition: all .15s; }
    .clientpg .edit-link svg { width: 14px; height: 14px; }
    .clientpg .edit-link:hover { color: var(--purple); border-color: var(--purple-300, #c3a4f7); background: var(--purple-bg); }
    .clientpg .about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 26px; }
    @media (max-width: 760px) { .cl .about-grid { grid-template-columns: 1fr; } }
    .clientpg .about-k { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gray2); margin-bottom: 9px; }
    .clientpg .about-v { font-size: 14.5px; color: var(--gray); line-height: 1.6; }
    .clientpg .empty { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--gray2); font-weight: 600; font-style: italic; }
    .clientpg .empty svg { width: 15px; height: 15px; color: var(--faint); }
    .clientpg .rules { display: flex; flex-direction: column; gap: 9px; }
    .clientpg .rule-chip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; font-weight: 600; color: var(--gray); }
    .clientpg .rule-chip .term { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; background: var(--surface); border: 1px solid var(--border); padding: 3px 9px; border-radius: 7px; color: var(--fg); }
    .clientpg .rule-chip .arrow { color: var(--faint); }
    .clientpg .rule-chip .temp { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 10px; border-radius: var(--r-pill); background: var(--purple-bg); color: var(--purple); }
    .clientpg .default-note { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--gray2); font-weight: 600; background: var(--surface); border: 1px solid var(--border); padding: 7px 12px; border-radius: var(--r-pill); }
    .clientpg .default-note svg { width: 14px; height: 14px; color: var(--purple); }

    /* Modo edição (inline no card About) */
    .clientpg .ed-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .clientpg .ed-field label { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--gray); }
    .clientpg .ed-field input, .cl .ed-field textarea { width: 100%; padding: 10px 13px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--card, #fff); font: inherit; font-size: 14px; color: var(--fg); }
    .clientpg .ed-field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
    .clientpg .ed-field input:focus, .cl .ed-field textarea:focus { outline: 0; border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
    .clientpg .ed-sub { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gray2); margin: 18px 0 10px; }
    .clientpg .ed-foot { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .clientpg .ed-msg { font-size: 13px; font-weight: 600; }
    .clientpg .ed-msg.ok { color: var(--ok-fg, #15803d); }
    .clientpg .ed-msg.err { color: var(--err-fg, #b91c1c); }
    .clientpg [hidden] { display: none !important; }

    .clientpg .sec-label { display: flex; align-items: center; gap: 13px; margin: 34px 0 16px; }
    .clientpg .sec-label b { font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--gray2); }
    .clientpg .sec-label .count { font-size: 11.5px; font-weight: 800; color: var(--purple); background: var(--purple-bg); padding: 3px 9px; border-radius: var(--r-pill); }
    .clientpg .sec-label .rule { flex: 1; height: 1px; background: var(--divider); }

    .clientpg .analyses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    @media (max-width: 980px) { .cl .analyses { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .cl .analyses { grid-template-columns: 1fr; } }
    .clientpg .acard { text-align: left; display: flex; flex-direction: column; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 20px 22px; cursor: pointer; transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease); text-decoration: none; color: inherit; }
    .clientpg .acard:hover { box-shadow: var(--shadow-lift); transform: translateY(-3px); border-color: var(--purple-300, #c3a4f7); }
    .clientpg .acard .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--purple); background: var(--purple-bg); padding: 5px 11px; border-radius: var(--r-pill); }
    .clientpg .acard .tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--purple); }
    .clientpg .acard h3 { font-size: 17px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin: 14px 0 0; }
    .clientpg .acard .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--gray2); font-weight: 600; }
    .clientpg .acard .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
    .clientpg .acard .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--divider); }
    .clientpg .acard .open { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--purple); }
    .clientpg .acard .open svg { width: 15px; height: 15px; transition: transform .2s var(--ease); }
    .clientpg .acard:hover .open svg { transform: translateX(3px); }
    .clientpg .acard.add { align-items: center; justify-content: center; gap: 10px; border-style: dashed; border-color: var(--border-strong); box-shadow: none; color: var(--gray2); font-size: 14px; font-weight: 700; min-height: 172px; }
    .clientpg .acard.add svg { width: 20px; height: 20px; }
    .clientpg .acard.add:hover { color: var(--purple); border-color: var(--purple-300, #c3a4f7); background: var(--purple-bg); }
    .clientpg .empty-an { color: var(--gray2); font-size: 14px; padding: 40px 0; }
  </style>
</head>
<body class="clientpg">
  <header class="home-bar" data-sub="Cliente" data-back="/"></header>
  <script src="/js/page-chrome.js" defer></script>

  <div class="page" id="page"><p class="empty-an">Carregando…</p></div>

  <script src="/js/temp-rules.js"></script>
  <script type="module">
    const page = document.getElementById('page');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const slug = decodeURIComponent((location.pathname.match(/\/cliente\/([^/]+)/) || [])[1] || '');
    const fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const TYPE_LABEL = { 'acompanhamento-lancamento': 'Acompanhamento', 'debriefing-lancamento': 'Debriefing', 'historico-lancamentos': 'Histórico', 'conversao-perfil': 'Conversão', 'criativos': 'Criativos', dashboard: 'Dashboard', ltv: 'LTV' };
    const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"/></svg>';
    const ICO_AN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>';
    const ICO_TAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.2"/></svg>';
    const ICO_THERMO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>';

    try {
      const [rows, clientsDoc, tempDefault] = await Promise.all([
        fetch('/api/analyses').then(r => r.json()),
        fetch('/api/clients').then(r => r.json()).catch(() => ({ clients: [] })),
        window.fetchTempDefault(),
      ]);
      const items = (rows || []).filter(r => r.client === slug)
        .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
      const reg = (clientsDoc.clients || []).find(c => c.slug === slug) || {};
      const name = reg.name || items[0]?.clientName || slug;
      document.title = `Cliente · ${name}`;
      const rules = reg.temp_rules || [];
      const types = new Set(items.map(i => i.type).filter(Boolean));

      const ruleChip = (r) => `<div class="rule-chip">${(r.contains || []).map(t => `<span class="term">${esc(t)}</span>`).join('')}<span class="arrow">→</span><span class="temp">${esc(r.label)}</span></div>`;
      const acard = (r) => `
        <a class="acard" href="/report/${encodeURIComponent(r.client)}/${encodeURIComponent(r.slug)}">
          <span class="tag">${esc(TYPE_LABEL[r.type] || r.type || 'Relatório')}</span>
          <h3>${esc(r.title || r.slug)}</h3>
          <div class="meta"><span>${esc(fmtDate(r.created_at)) || '—'}</span></div>
          <div class="foot"><span class="open">Abrir ${ARROW}</span><span class="by">${esc(r.slug)}</span></div>
        </a>`;

      page.innerHTML = `
        <div class="crumbs"><a href="/">Clientes</a><span class="sl">›</span><span class="cur">${esc(name)}</span></div>
        <div class="chead">
          <span class="av">${esc((name || '?').trim().charAt(0).toUpperCase())}</span>
          <div class="id"><h1>${esc(name)}</h1><div class="slug">${esc(slug)}</div></div>
        </div>

        <div class="stats">
          <div class="stat"><span class="si">${ICO_AN}</span><span class="sv"><b>${items.length}</b><small>${items.length === 1 ? 'análise' : 'análises'}</small></span></div>
          <div class="stat"><span class="si">${ICO_TAG}</span><span class="sv"><b>${types.size}</b><small>${types.size === 1 ? 'tipo' : 'tipos'}</small></span></div>
          <div class="stat"><span class="si">${ICO_THERMO}</span><span class="sv"><b>${rules.length}</b><small>${rules.length === 1 ? 'regra de temp.' : 'regras de temp.'}</small></span></div>
        </div>

        <div class="about">
          <div class="about-hd"><b>Sobre o cliente</b><span class="rule"></span><button class="edit-link" id="ed-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Editar</button></div>

          <div id="about-view">
            <div class="about-grid">
              <div>
                <div class="about-k">Contexto do negócio</div>
                ${reg.context ? `<div class="about-v">${esc(reg.context)}</div>`
                  : `<span class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Sem contexto cadastrado</span>`}
              </div>
              <div>
                <div class="about-k">Regras de temperatura</div>
                ${rules.length ? `<div class="rules">${rules.map(ruleChip).join('')}</div>`
                  : `<span class="default-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4"/></svg>Usando o padrão geral (Configurações)</span>`}
              </div>
            </div>
          </div>

          <div id="about-edit" hidden>
            <div class="ed-field"><label for="ed-name">Nome</label><input id="ed-name" value="${esc(reg.name || name)}" /></div>
            <div class="ed-field"><label for="ed-ctx">Contexto do negócio</label><textarea id="ed-ctx" placeholder="O que o cliente faz, produto principal, ticket, público, modelo de lançamento…">${esc(reg.context || '')}</textarea></div>
            <p class="ed-sub">Regras de temperatura</p>
            <div id="temp-editor"></div>
            <div class="ed-foot">
              <button class="btn btn--primary" id="ed-save">Salvar</button>
              <button class="btn" id="ed-cancel">Cancelar</button>
              <span class="ed-msg" id="ed-msg"></span>
            </div>
          </div>
        </div>

        <div class="sec-label"><b>Análises</b>${items.length ? `<span class="count">${items.length}</span>` : ''}<span class="rule"></span></div>
        ${items.length
          ? `<div class="analyses">${items.map(acard).join('')}
              <a class="acard add" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Nova análise</a></div>`
          : `<p class="empty-an">Nenhuma análise para este cliente ainda.</p>`}`;

      // Editar ⇄ visualizar
      const view = document.getElementById('about-view');
      const edit = document.getElementById('about-edit');
      const toggle = document.getElementById('ed-toggle');
      const tctl = window.mountTempRules(document.getElementById('temp-editor'),
        { rules, overwrite: !!reg.temp_overwrite });
      const showEdit = (on) => { view.hidden = on; edit.hidden = !on; toggle.hidden = on; };
      toggle.addEventListener('click', () => showEdit(true));
      document.getElementById('ed-cancel').addEventListener('click', () => showEdit(false));

      const msg = document.getElementById('ed-msg');
      const save = document.getElementById('ed-save');
      save.addEventListener('click', async () => {
        const nm = document.getElementById('ed-name').value.trim();
        if (!nm) { msg.className = 'ed-msg err'; msg.textContent = 'Informe o nome.'; return; }
        save.disabled = true; msg.className = 'ed-msg'; msg.textContent = 'Salvando…';
        try {
          const r = await fetch('/api/clients', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: nm, context: document.getElementById('ed-ctx').value.trim(),
              temp_rules: tctl.getRules(), temp_overwrite: tctl.getOverwrite() }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || 'falha');
          location.reload();
        } catch (e) { msg.className = 'ed-msg err'; msg.textContent = '⚠ ' + e.message; save.disabled = false; }
      });
    } catch (e) {
      page.innerHTML = `<p class="empty-an">Erro ao carregar: ${esc(e.message)}</p>`;
    }
  </script>
</body>
</html>
