<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="chart-options.js"></script>
  <script src="renderer.js"></script>
</head>
<body>

<aside id="sidebar">
  <div class="sb-head">
    <div class="sb-brand-label">Relatório</div>
    <div class="sb-brand-title" id="sb-brand-title">—</div>
  </div>
  <div class="sb-nav-label">Páginas</div>
  <nav id="sb-pages"></nav>
  <div class="sb-foot">
    <button id="comment-toggle-btn"><span>Comentários</span><span id="ctb-n">0</span></button>
    <button id="print-btn">↓ Imprimir / PDF</button>
  </div>
</aside>

<div id="comment-panel">
  <div class="cp-head">
    <span class="cp-title">Comentários</span>
    <span class="cp-count" id="cp-total">0</span>
    <button class="cp-close" id="cp-close-btn">&#215;</button>
  </div>
  <div class="cp-filters">
    <button class="cp-filter cp-active" data-filter="todos">Todos</button>
    <button class="cp-filter" data-filter="detalhar">🔍 Detalhar</button>
    <button class="cp-filter" data-filter="insight">🧙 Insight</button>
    <button class="cp-filter" data-filter="acao">✅ Ação</button>
  </div>
  <div class="cp-list" id="cp-list"></div>
  <div class="cp-foot">
    <button id="cp-export-btn">↓ Exportar CSV</button>
  </div>
</div>

<div id="comment-modal">
  <div class="cm-dialog">
    <div class="cm-hd">
      <div>
        <div class="cm-title">Adicionar comentário</div>
        <div class="cm-sec-lbl" id="cm-sec-lbl"></div>
      </div>
      <button class="cm-x" id="cm-x">&#215;</button>
    </div>
    <div class="cm-anchor-block" id="cm-anchor-block">
      <div class="cm-anchor-lbl">Contexto capturado</div>
      <div class="cm-anchor-txt" id="cm-anchor-txt"></div>
    </div>
    <div class="cm-types">
      <button class="cm-type" data-type="detalhar">🔍 Detalhar</button>
      <button class="cm-type" data-type="insight">🧙 Insight</button>
      <button class="cm-type" data-type="acao">✅ Ação</button>
    </div>
    <textarea class="cm-ta" id="cm-ta" placeholder="Escreva seu comentário… (Ctrl+Enter para salvar)"></textarea>
    <div class="cm-actions">
      <button class="cm-cancel" id="cm-cancel">Cancelar</button>
      <button class="cm-save"   id="cm-save">Salvar</button>
    </div>
  </div>
</div>

<div id="ctx-menu">
  <div class="ctx-item" id="ctx-comment">
    <span class="ctx-icon">💬</span>
    <span>Adicionar comentário</span>
  </div>
</div>

<div id="tab-bar"></div>

<main id="main">
  <div id="export-root"></div>
</main>

<script>
/* ════════════════════════════════════════════════
   REPORT.HTML — app shell
   ════════════════════════════════════════════════ */

const slug = location.pathname.split('/').filter(Boolean).pop();
let reportData   = null;
let currentPage  = null;
let currentSec   = null;
const secCache   = new Map();
const chartInst  = [];   // active ApexCharts instances

/* ── Init ── */
async function init() {
  try {
    const res = await fetch(`/api/${slug}/data`);
    if (!res.ok) throw new Error('data.json não encontrado');
    reportData = await res.json();
  } catch (e) {
    document.getElementById('export-root').innerHTML =
      `<div style="padding:60px 56px"><p class="sm">Erro ao carregar relatório: ${e.message}</p></div>`;
    return;
  }

  document.title = reportData.meta?.title || reportData.meta?.client || 'Relatório';
  document.getElementById('sb-brand-title').textContent = reportData.meta?.client || '';
  document.documentElement.dataset.theme = reportData.meta?.theme || 'light';

  buildNavigation(reportData.pages || []);
  connectSSE();
  await loadComments();

  const fp = reportData.pages?.[0];
  const fs = fp?.sections?.[0];
  if (fp && fs) await switchPage(fp.id, fs.id);
}

/* ── Navigation ── */
function buildNavigation(pages) {
  const sbPages = document.getElementById('sb-pages');
  const tabBar  = document.getElementById('tab-bar');

  const lbl = document.createElement('span');
  lbl.id = 'tab-bar-label';
  tabBar.appendChild(lbl);

  pages.forEach(page => {
    // sidebar group
    const grp  = document.createElement('div');
    grp.className = 'sb-page-group';
    grp.dataset.pageGroup = page.id;

    const pgBtn = document.createElement('button');
    pgBtn.className = 'sb-page-link';
    pgBtn.dataset.pageId = page.id;
    const cnt = document.createElement('span');
    cnt.className = 'sb-page-count';
    cnt.textContent = page.sections.length;
    pgBtn.append(document.createTextNode(page.label), cnt);
    pgBtn.addEventListener('click', () => switchPage(page.id));
    grp.appendChild(pgBtn);

    const secList = document.createElement('div');
    secList.className = 'sb-section-list';
    secList.dataset.secList = page.id;

    page.sections.forEach(sec => {
      const s = document.createElement('button');
      s.className = 'sb-sec-link';
      s.dataset.secPage = page.id;
      s.dataset.secId   = sec.id;
      s.dataset.origLabel = sec.label;
      s.textContent = sec.label;
      s.addEventListener('click', () => switchSection(page.id, sec.id));
      secList.appendChild(s);
    });
    grp.appendChild(secList);
    sbPages.appendChild(grp);

    // tab group
    const tabGrp = document.createElement('div');
    tabGrp.className = 'tab-group';
    tabGrp.dataset.tabGroup = page.id;

    page.sections.forEach(sec => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.dataset.tabSection = sec.id;
      btn.dataset.tabPage    = page.id;
      btn.dataset.origLabel  = sec.label;
      btn.textContent = sec.label;
      btn.addEventListener('click', () => switchSection(page.id, sec.id));
      tabGrp.appendChild(btn);
    });
    tabBar.appendChild(tabGrp);
  });
}

async function switchPage(pageId, secId) {
  const page = reportData.pages.find(p => p.id === pageId);
  document.querySelectorAll('.sb-page-link').forEach(b =>
    b.classList.toggle('sb-page-active', b.dataset.pageId === pageId));
  document.querySelectorAll('.tab-group').forEach(g =>
    g.classList.toggle('tab-group-active', g.dataset.tabGroup === pageId));
  document.querySelectorAll('.sb-section-list').forEach(l =>
    l.classList.toggle('open', l.dataset.secList === pageId));
  const lbl = document.getElementById('tab-bar-label');
  if (lbl) lbl.textContent = page?.label || '';

  const target = secId || page?.sections?.[0]?.id;
  if (target) await switchSection(pageId, target);
}

async function switchSection(pageId, secId) {
  document.querySelectorAll('[data-tab-section]').forEach(b =>
    b.classList.toggle('tab-active', b.dataset.tabSection === secId && b.dataset.tabPage === pageId));
  document.querySelectorAll('[data-sec-id]').forEach(b =>
    b.classList.toggle('sb-sec-active', b.dataset.secId === secId && b.dataset.secPage === pageId));

  currentPage = pageId;
  currentSec  = secId;

  // destroy active charts
  chartInst.forEach(c => { try { c.destroy(); } catch {} });
  chartInst.length = 0;

  const root = document.getElementById('export-root');
  root.innerHTML = '<div style="padding:60px 56px 80px"><p class="sm" style="color:var(--gray2)">Carregando…</p></div>';

  let data = secCache.get(secId);
  if (!data) {
    const r = await fetch(`/api/${slug}/section/${secId}`);
    if (!r.ok) {
      root.innerHTML = `<div style="padding:60px 56px"><p class="sm">Seção não encontrada: <code>${secId}</code></p></div>`;
      return;
    }
    data = await r.json();
    secCache.set(secId, data);
  }

  root.innerHTML = '';
  Renderer.renderSection(data, root, inst => chartInst.push(inst));
  window.scrollTo({ top: 0 });
  renderBadges();
}

/* ── SSE: live reload ── */
function connectSSE() {
  const es = new EventSource(`/api/${slug}/watch`);
  es.onmessage = ({ data: id }) => {
    if (id === 'connected') return;
    secCache.delete(id);
    if (id === currentSec) switchSection(currentPage, id);
  };
  es.onerror = () => setTimeout(connectSSE, 3000);
}

/* ═══════════════════════════════════════════════
   COMMENT SYSTEM
   ═══════════════════════════════════════════════ */
let comments  = [];
let cmFilter  = 'todos';
let pendingSec = null, pendingLabel = null, pendingAnchor = null, selType = null;

const esc       = t => (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const fmtDate   = iso => { const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const typeLabel = t => ({detalhar:'🔍 Detalhar', insight:'🧙 Insight', acao:'✅ Ação'}[t] || t);
const uid       = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);

async function loadComments() {
  try {
    const res = await fetch(`/api/${slug}/comments`);
    comments  = await res.json();
  } catch { comments = []; }
  renderPanel();
  renderBadges();
}

async function saveComment(comment) {
  comments.push(comment);
  renderPanel();
  renderBadges();
  try { await fetch(`/api/${slug}/comments`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(comment) }); }
  catch (e) { console.error('Falha ao salvar comentário:', e); }
}

async function deleteComment(id) {
  comments = comments.filter(c => c.id !== id);
  renderPanel();
  renderBadges();
  try { await fetch(`/api/${slug}/comments/${id}`, { method: 'DELETE' }); }
  catch (e) { console.error('Falha ao deletar comentário:', e); }
}

function renderPanel() {
  const list  = cmFilter === 'todos' ? comments : comments.filter(c => c.type === cmFilter);
  const total = comments.length;
  document.getElementById('cp-total').textContent = total;
  document.getElementById('ctb-n').textContent    = total;
  const btn = document.getElementById('comment-toggle-btn');
  total > 0 ? btn.classList.add('ctb-has') : btn.classList.remove('ctb-has');

  document.getElementById('cp-list').innerHTML = list.length === 0
    ? `<div class="cp-empty">Nenhum comentário${cmFilter!=='todos'?' deste tipo':''}.<br>Clique com o <strong>botão direito</strong> em qualquer parte do relatório.</div>`
    : list.map(c => `
        <div class="cp-item">
          <div class="cp-item-hd">
            <span class="cp-type cp-type-${c.type}">${typeLabel(c.type)}</span>
            <span class="cp-sec">${esc(c.sectionLabel)}</span>
          </div>
          ${c.anchor ? `<div class="cp-anchor">"${esc(c.anchor)}"</div>` : ''}
          <div class="cp-text">${esc(c.text)}</div>
          <div class="cp-date">${fmtDate(c.createdAt)}</div>
          <button class="cp-del" data-del="${c.id}">&#215;</button>
        </div>`).join('');
}

function renderBadges() {
  const TYPE_EMOJI = { detalhar: '🔍', insight: '🧙', acao: '✅' };
  const bySection  = {};
  comments.forEach(c => {
    if (!bySection[c.sectionId]) bySection[c.sectionId] = new Set();
    bySection[c.sectionId].add(TYPE_EMOJI[c.type] || '●');
  });

  document.querySelectorAll('[data-tab-section]').forEach(btn => {
    const orig   = btn.dataset.origLabel || btn.textContent.replace(/[\u{1F300}-\u{1FFFF}●🔍✅]/gu, '').trim();
    btn.dataset.origLabel = orig;
    const emojis = bySection[btn.dataset.tabSection];
    btn.textContent = emojis ? `${orig} ${[...emojis].join('')}` : orig;
  });

  document.querySelectorAll('[data-sec-id]').forEach(btn => {
    const orig   = btn.dataset.origLabel || btn.textContent.replace(/[\u{1F300}-\u{1FFFF}●🔍✅]/gu, '').trim();
    btn.dataset.origLabel = orig;
    const emojis = bySection[btn.dataset.secId];
    btn.textContent = emojis ? `${orig} ${[...emojis].join('')}` : orig;
  });
}

function captureContext(el) {
  const priority = ['.find-title','.mv','.chart-title','.find-tag','.hl','.label-sec','.ml','td','th','.find-note','.sm'];
  let node = el;
  while (node && node !== document.body) {
    for (const sel of priority) {
      if (node.matches?.(sel)) {
        const t = node.textContent?.trim().replace(/\s+/g,' ');
        if (t && t.length > 3) return t.slice(0, 180);
      }
    }
    node = node.parentElement;
  }
  const t = el.textContent?.trim().replace(/\s+/g,' ');
  return (t && t.length > 3 && t.length < 200) ? t.slice(0, 180) : null;
}

function openCommentModal(secId, secLabel, anchor) {
  pendingSec    = secId;
  pendingLabel  = secLabel;
  pendingAnchor = anchor;
  selType       = null;
  document.getElementById('cm-sec-lbl').textContent = secLabel || '';
  document.querySelectorAll('.cm-type').forEach(b => b.className = 'cm-type');
  document.getElementById('cm-ta').value = '';
  const ab = document.getElementById('cm-anchor-block');
  if (anchor) {
    ab.classList.add('visible');
    document.getElementById('cm-anchor-txt').textContent = anchor;
  } else {
    ab.classList.remove('visible');
  }
  document.getElementById('comment-modal').classList.add('open');
  document.getElementById('cm-ta').focus();
}

/* ── Comment modal listeners ── */
document.querySelectorAll('.cm-type').forEach(b => {
  b.addEventListener('click', () => {
    selType = b.dataset.type;
    document.querySelectorAll('.cm-type').forEach(x => x.className = 'cm-type');
    b.classList.add(`sel-${selType}`);
  });
});

document.getElementById('cm-save').addEventListener('click', async () => {
  const text = document.getElementById('cm-ta').value.trim();
  if (!text || !selType) return;
  await saveComment({
    id: uid(), sectionId: pendingSec, sectionLabel: pendingLabel,
    type: selType, text, anchor: pendingAnchor || '', createdAt: new Date().toISOString()
  });
  document.getElementById('comment-modal').classList.remove('open');
});

document.getElementById('cm-ta').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') document.getElementById('cm-save').click();
});

document.getElementById('cm-cancel').addEventListener('click', () =>
  document.getElementById('comment-modal').classList.remove('open'));
document.getElementById('cm-x').addEventListener('click', () =>
  document.getElementById('comment-modal').classList.remove('open'));

/* ── Panel controls ── */
document.getElementById('comment-toggle-btn').addEventListener('click', () => {
  const panel = document.getElementById('comment-panel');
  const isOpen = panel.classList.toggle('open');
  document.getElementById('comment-toggle-btn').classList.toggle('ctb-on', isOpen);
});
document.getElementById('cp-close-btn').addEventListener('click', () => {
  document.getElementById('comment-panel').classList.remove('open');
  document.getElementById('comment-toggle-btn').classList.remove('ctb-on');
});

document.querySelectorAll('.cp-filter').forEach(b =>
  b.addEventListener('click', () => {
    cmFilter = b.dataset.filter;
    document.querySelectorAll('.cp-filter').forEach(x => x.classList.toggle('cp-active', x === b));
    renderPanel();
  }));

document.getElementById('cp-list').addEventListener('click', e => {
  const btn = e.target.closest('[data-del]');
  if (btn) deleteComment(btn.dataset.del);
});

document.getElementById('cp-export-btn').addEventListener('click', () => {
  const rows = ['id,sectionId,sectionLabel,type,text,anchor,status,createdAt',
    ...comments.map(c => [c.id,c.sectionId,q(c.sectionLabel),c.type,q(c.text),q(c.anchor||''),c.status||'novo',c.createdAt].join(','))
  ];
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `comentarios-${slug}.csv`;
  a.click();
});
function q(v) { return '"' + (v||'').replace(/"/g,'""') + '"'; }

/* ── sc-add (+ button on section) ── */
document.getElementById('export-root').addEventListener('click', e => {
  const btn = e.target.closest('.sc-add');
  if (!btn) return;
  openCommentModal(btn.dataset.secId, btn.dataset.secLabel, null);
});

/* ── Right-click context menu ── */
const ctxMenu = document.getElementById('ctx-menu');
let ctxTarget = null;
document.addEventListener('contextmenu', e => {
  const sec = e.target.closest('[data-report-section]');
  if (!sec) { ctxMenu.classList.remove('open'); return; }
  e.preventDefault();
  ctxTarget = { secId: sec.id, secLabel: sec.dataset.reportSection, anchor: captureContext(e.target) };
  ctxMenu.style.left = e.clientX + 'px';
  ctxMenu.style.top  = e.clientY + 'px';
  ctxMenu.classList.add('open');
});
document.addEventListener('click', () => ctxMenu.classList.remove('open'));

document.getElementById('ctx-comment').addEventListener('click', () => {
  if (ctxTarget) openCommentModal(ctxTarget.secId, ctxTarget.secLabel, ctxTarget.anchor);
});

/* ── Insight card modal ── */
document.addEventListener('click', e => {
  const card = e.target.closest('[data-modal]');
  if (card) { const m = document.getElementById(card.dataset.modal); if (m) { m.classList.add('open'); document.body.style.overflow='hidden'; } return; }
  const cb = e.target.closest('[data-ic-close]');
  if (cb) { const m = cb.closest('.ic-overlay'); if (m) { m.classList.remove('open'); document.body.style.overflow=''; } return; }
  if (e.target.classList.contains('ic-overlay')) { e.target.classList.remove('open'); document.body.style.overflow=''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.ic-overlay.open').forEach(m => { m.classList.remove('open'); document.body.style.overflow=''; });
});

/* ── Print ── */
document.getElementById('print-btn').addEventListener('click', () => window.print());

/* ── Start ── */
init();
</script>
</body>
</html>
