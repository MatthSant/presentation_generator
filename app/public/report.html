<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relatório</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/vendor/gridstack.min.css" />
  <link rel="stylesheet" href="/style.css" />
  <!-- ApexCharts is the only vendor lib the read path needs; Gridstack loads
       lazily only when the layout editor opens. Module script runs after it. -->
  <script defer src="/vendor/apexcharts.min.js"></script>
  <script type="module" src="/js/client/main.js"></script>
</head>
<body>

  <!-- ── SIDENAV (modo de navegação lateral; ativado por data.json meta.nav === 'sidebar') ── -->
  <aside id="sidenav" hidden></aside>

  <!-- ── TOPNAV ── -->
  <nav id="topnav">
    <a class="tn-home" href="/" title="Voltar ao início" aria-label="Voltar ao início">
      <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>
    </a>
    <a class="tn-logo-link" href="/" title="Início"><img class="tn-logo" src="/assets/witly-logo.png" alt="Witly Grimório" /></a>
    <div class="tn-brand">
      <span class="tn-client" id="tn-client">—</span>
    </div>
    <div class="tn-pages" id="tn-pages"></div>
    <div class="tn-right">
      <button id="layout-edit-btn" title="Reorganizar os blocos do relatório">
        <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 10h16M10 10v10"/></svg>
        <span>Layout</span>
      </button>
      <span id="tn-edit-actions" hidden>
        <button id="tn-edit-cancel" class="tn-edit-btn tn-edit-cancel">Cancelar</button>
        <button id="tn-edit-save" class="tn-edit-btn tn-edit-save">Salvar</button>
      </span>
      <a id="update-btn" title="Atualizar a análise — reupar CSV ou ajustar a configuração">
        <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 1 0-2.2 6.2"/><path d="M20 5v6.5h-6.5"/></svg>
        <span>Atualizar</span>
      </a>
      <button id="export-html-btn" title="Exportar relatório como HTML standalone (offline)">
        <svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/><path d="M13.5 6 10.5 18"/></svg>
        <span>HTML</span>
      </button>
    </div>
  </nav>
  <script>
    // Ponto de entrada da atualização: monta o link a partir de /report/<cliente>/<slug>.
    (function () {
      var m = location.pathname.match(/\/report\/([^/]+)\/([^/]+)/);
      var a = document.getElementById('update-btn');
      if (m && a) a.href = '/atualizar.html?c=' + encodeURIComponent(m[1]) + '&s=' + encodeURIComponent(m[2]);
    })();
  </script>

  <!-- ── SECTION BAR ── -->
  <div id="section-bar">
    <span id="sb-page-label">—</span>
    <div id="sb-tabs"></div>
  </div>

  <!-- ── MAIN ── -->
  <main id="main">
    <div id="export-root"></div>
  </main>

  <!-- modal overlays (detalhamento dialogs) render here -->
  <div id="modal-root"></div>

<!-- ── FILTER FAB + MODAL ── -->
  <button id="filter-fab" hidden title="Filtrar os dados do relatório" aria-label="Filtros">
    <span class="flt-icon"><svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.3 7.4V19L10.3 21v-8.6z"/></svg></span>
    <span id="filter-count">0</span>
  </button>
  <div id="filter-modal">
    <div class="flt-dialog">
      <div class="flt-hd">
        <div class="flt-title">Filtros</div>
        <button class="flt-x" id="filter-close">&#215;</button>
      </div>
      <div id="filter-body"></div>
      <div class="flt-actions">
        <button class="flt-clear" id="filter-clear">Limpar</button>
      </div>
    </div>
  </div>

</body>
</html>
