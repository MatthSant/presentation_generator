<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clientes — Cadastro</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: var(--bg-page); }
    .home-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 11px; height: 52px; padding: 0 22px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .bar-logo { height: 20px; width: auto; display: block; }
    .bar-logo-sep { width: 1px; height: 20px; background: var(--border); }
    .home-brand { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .home-brand small { display:block; font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gray2); }
    .bar-back { margin-left: auto; display:inline-flex; align-items:center; gap:6px; font-size: 13px; font-weight: 600; color: var(--gray); text-decoration: none; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); }
    .bar-back:hover { color: var(--fg); border-color: var(--border-strong); }
    .bar-back svg { width: 15px; height: 15px; }

    .c-wrap { max-width: 820px; margin: 0 auto; padding: 36px 28px 80px; }
    .c-title { font-size: 26px; font-weight: 750; letter-spacing: -.02em; margin: 0 0 6px; }
    .c-sub { font-size: 14.5px; color: var(--gray); line-height: 1.6; margin: 0 0 24px; max-width: 64ch; }
    .c-card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 26px; }
    .c-h { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--purple); margin: 0 0 14px; }
    .c-field { display:flex; flex-direction:column; gap:5px; margin-bottom: 14px; }
    .c-field label { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--gray2); }
    .c-field input, .c-field textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; font-family: 'Exo 2', sans-serif; font-size: 13.5px; color: var(--fg); outline: none; resize: vertical; }
    .c-field textarea { min-height: 90px; line-height: 1.5; }
    .c-field input:focus, .c-field textarea:focus { border-color: var(--purple); }
    .c-btn { display:inline-flex; align-items:center; gap:7px; font-size: 13.5px; font-weight: 700; color:#fff; background: var(--purple); border: none; border-radius: 9px; padding: 9px 18px; cursor: pointer; }
    .c-btn:disabled { opacity:.55; }
    .c-msg { margin-top: 12px; font-size: 13px; border-radius: 8px; padding: 9px 12px; display:none; }
    .c-msg.ok { display:block; background:#EAF3DE; color:#27500A; }
    .c-msg.err { display:block; background:#FCEBEB; color:#A32D2D; }
    .c-list { display:flex; flex-direction:column; gap:11px; }
    .c-item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
    .c-item-h { display:flex; align-items:center; gap:9px; }
    .c-mono { width: 30px; height: 30px; border-radius: 8px; display:grid; place-items:center; font-size: 13px; font-weight: 800; color: var(--purple); background: var(--purple-bg); }
    .c-name { font-size: 14.5px; font-weight: 700; }
    .c-slug { font-size: 11.5px; color: var(--gray2); font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .c-ctx { font-size: 13px; color: var(--gray); line-height: 1.55; margin: 9px 0 0; }
    .c-empty { color: var(--gray2); font-size: 13.5px; padding: 18px 0; }
  </style>
</head>
<body>
  <header class="home-bar">
    <img class="bar-logo" src="/assets/witly-logo.png" alt="Witly" />
    <span class="bar-logo-sep"></span>
    <span class="home-brand">Dossiê do Consultor<small>Clientes</small></span>
    <a class="bar-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>Voltar</a>
  </header>

  <div class="c-wrap">
    <h1 class="c-title">Clientes</h1>
    <p class="c-sub">Cadastre os clientes padrões com nome e contexto do negócio. O contexto descreve o que o cliente faz e ajuda a orientar as análises e os insights gerados.</p>

    <div class="c-card">
      <p class="c-h">Novo cliente</p>
      <div class="c-field"><label>Nome</label><input id="f-name" placeholder="ex.: INDÊ" /></div>
      <div class="c-field"><label>Contexto do negócio</label><textarea id="f-ctx" placeholder="O que o cliente faz, produto principal, ticket, público, modelo de lançamento, particularidades…"></textarea></div>
      <button class="c-btn" id="save"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Salvar cliente</button>
      <div class="c-msg" id="msg"></div>
    </div>

    <p class="c-h">Cadastrados</p>
    <div class="c-list" id="list"><p class="c-empty">Carregando…</p></div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const show = (cls, t) => { const m = $('msg'); m.className = 'c-msg ' + cls; m.textContent = t; };

    async function load() {
      try {
        const d = await (await fetch('/api/clients')).json();
        const cs = d.clients || [];
        $('list').innerHTML = cs.length ? cs.map(c => `
          <div class="c-item">
            <div class="c-item-h">
              <span class="c-mono">${esc((c.name || '?').trim().charAt(0).toUpperCase())}</span>
              <span><span class="c-name">${esc(c.name)}</span> <span class="c-slug">${esc(c.slug)}</span></span>
            </div>
            ${c.context ? `<p class="c-ctx">${esc(c.context)}</p>` : ''}
          </div>`).join('') : '<p class="c-empty">Nenhum cliente cadastrado ainda.</p>';
      } catch (e) { $('list').innerHTML = '<p class="c-empty">Erro ao carregar.</p>'; }
    }

    $('save').addEventListener('click', async () => {
      const name = $('f-name').value.trim();
      if (!name) { show('err', 'Informe o nome.'); return; }
      $('save').disabled = true;
      try {
        const r = await fetch('/api/clients', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, context: $('f-ctx').value.trim() }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'falha');
        show('ok', `Salvo (${d.slug}).`);
        $('f-name').value = ''; $('f-ctx').value = '';
        load();
      } catch (e) { show('err', '⚠ ' + e.message); }
      finally { $('save').disabled = false; }
    });

    load();
  </script>
</body>
</html>
