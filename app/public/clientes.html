<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clientes — Cadastro</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body.clientes { background: var(--canvas, var(--bg-page)); }
    .clientes .page { max-width: 1200px; margin: 0 auto; padding: 30px 28px 80px; }
    .clientes h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
    .clientes .desc { font-size: 15px; color: var(--gray2); font-weight: 500; line-height: 1.6; max-width: 74ch; margin-top: 8px; }
    .clientes .layout { display: grid; grid-template-columns: 380px 1fr; gap: 26px; align-items: start; margin-top: 26px; }
    @media (max-width: 860px) { .clientes .layout { grid-template-columns: 1fr; } .clientes .form-card { position: static; } }

    .clientes .form-card { position: sticky; top: 92px; background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 24px; }
    .clientes .form-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--purple); display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .clientes .form-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--divider); }
    .clientes .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
    .clientes .label { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--gray); }
    .clientes .ctrl { width: 100%; padding: 11px 13px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--card, #fff); font: inherit; font-size: 14px; color: var(--fg); transition: border-color .15s, box-shadow .15s; }
    .clientes textarea.ctrl { min-height: 150px; resize: vertical; line-height: 1.55; }
    .clientes .ctrl::placeholder { color: var(--faint); }
    .clientes .ctrl:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
    .clientes .btn { display: inline-flex; align-items: center; gap: 9px; padding: 12px 18px; border-radius: var(--r-pill); font: inherit; font-size: 14px; font-weight: 700; border: 1px solid var(--border-strong); background: var(--card, #fff); color: var(--fg); cursor: pointer; transition: background .15s, border-color .15s, transform .12s, box-shadow .15s; }
    .clientes .btn svg { width: 16px; height: 16px; }
    .clientes .btn.primary { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 10px 22px -10px rgba(124,58,237,.7); width: 100%; justify-content: center; }
    .clientes .btn.primary:hover { background: var(--purple-600); border-color: var(--purple-600); transform: translateY(-1px); }
    .clientes .msg { margin-top: 14px; font-size: 13px; font-weight: 600; border-radius: var(--r-md); padding: 9px 12px; display: none; }
    .clientes .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-fg); }
    .clientes .msg.err { display: block; background: var(--err-bg); color: var(--err-fg); }

    .clientes .list-hd { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .clientes .list-hd b { font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--gray2); }
    .clientes .list-hd .count { font-size: 11.5px; font-weight: 800; color: var(--purple); background: var(--purple-bg); padding: 3px 9px; border-radius: var(--r-pill); }
    .clientes .list-hd .grow { flex: 1; }
    .clientes .search { display: flex; align-items: center; gap: 9px; width: 260px; max-width: 50vw; padding: 0 13px; height: 40px; border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: var(--card, #fff); }
    .clientes .search svg { width: 15px; height: 15px; color: var(--gray2); flex-shrink: 0; }
    .clientes .search input { flex: 1; min-width: 0; border: none; outline: none; background: none; font: inherit; font-size: 13.5px; color: var(--fg); }

    .clientes .clients { display: flex; flex-direction: column; gap: 14px; }
    .clientes .ccard { background: var(--card, #fff); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: 20px 22px; transition: box-shadow .2s var(--ease), border-color .2s var(--ease); }
    .clientes .ccard:hover { box-shadow: var(--shadow-lift); border-color: var(--purple-300, #c3a4f7); }
    .clientes .cc-top { display: flex; align-items: center; gap: 13px; }
    .clientes .cc-av { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .clientes .cc-av.a1 { background: linear-gradient(135deg, var(--purple), #9a63f5); }
    .clientes .cc-av.a2 { background: linear-gradient(135deg, var(--plum, #2E084B), var(--purple-600)); }
    .clientes .cc-id { flex: 1; min-width: 0; }
    .clientes .cc-id b { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
    .clientes .cc-id .slug { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--gray2); margin-left: 9px; }
    .clientes .cc-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .clientes .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--card, #fff); color: var(--gray2); display: grid; place-items: center; cursor: pointer; transition: all .15s; text-decoration: none; }
    .clientes .icon-btn svg { width: 16px; height: 16px; }
    .clientes .icon-btn:hover { color: var(--purple); border-color: var(--purple-300, #c3a4f7); background: var(--purple-bg); }
    .clientes .cc-ctx { font-size: 13.5px; color: var(--gray); line-height: 1.6; margin-top: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .clientes .cc-empty-ctx { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray2); font-weight: 600; font-style: italic; margin-top: 13px; }
    .clientes .cc-empty-ctx svg { width: 15px; height: 15px; color: var(--faint); }
    .clientes .cc-foot { display: flex; align-items: center; gap: 16px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--divider); }
    .clientes .cc-stat { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--gray2); }
    .clientes .cc-stat svg { width: 14px; height: 14px; color: var(--purple); }
    .clientes .cc-open { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--purple); cursor: pointer; text-decoration: none; }
    .clientes .cc-open svg { width: 15px; height: 15px; transition: transform .2s var(--ease); }
    .clientes .cc-open:hover svg { transform: translateX(3px); }
    .clientes .cc-empty { color: var(--gray2); font-size: 14px; padding: 40px 0; text-align: center; }
  </style>
</head>
<body class="clientes">
  <header class="home-bar" data-sub="Clientes" data-back="/"></header>
  <script src="/js/page-chrome.js" defer></script>

  <div class="page">
    <h1>Clientes</h1>
    <p class="desc">Cadastre os clientes padrões com nome e contexto do negócio. O contexto descreve o que o cliente faz e orienta as análises e os insights. As regras de temperatura e a edição completa ficam na página de cada cliente.</p>

    <div class="layout">
      <div class="form-card">
        <p class="form-eyebrow">Novo cliente</p>
        <div class="field"><span class="label">Nome</span><input id="f-name" class="ctrl" placeholder="ex.: INDÊ" /></div>
        <div class="field"><span class="label">Contexto do negócio</span><textarea id="f-ctx" class="ctrl" placeholder="O que o cliente faz, produto principal, ticket, público, modelo de lançamento, particularidades…"></textarea></div>
        <button class="btn primary" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Salvar cliente</button>
        <div class="msg" id="msg"></div>
      </div>

      <div>
        <div class="list-hd">
          <b>Cadastrados</b><span class="count" id="count">0</span><span class="grow"></span>
          <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Buscar cliente…" /></div>
        </div>
        <div class="clients" id="list"><p class="cc-empty">Carregando…</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const show = (cls, t) => { const m = $('msg'); m.className = 'msg ' + cls; m.textContent = t; };
    const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"/></svg>';
    const IC_AN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>';
    const IC_TH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>';
    const IC_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

    let CLIENTS = [];
    let COUNTS = {};

    function card(c, i) {
      const slug = encodeURIComponent(c.slug);
      const n = COUNTS[c.slug] || 0;
      const rules = (c.temp_rules || []).length;
      return `<div class="ccard">
        <div class="cc-top">
          <span class="cc-av ${i % 2 ? 'a2' : 'a1'}">${esc((c.name || '?').trim().charAt(0).toUpperCase())}</span>
          <span class="cc-id"><b>${esc(c.name)}</b><span class="slug">${esc(c.slug)}</span></span>
          <span class="cc-actions"><a class="icon-btn" href="/cliente/${slug}" title="Abrir / editar">${IC_EDIT}</a></span>
        </div>
        ${c.context ? `<p class="cc-ctx">${esc(c.context)}</p>`
          : `<span class="cc-empty-ctx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Sem contexto cadastrado</span>`}
        <div class="cc-foot">
          <span class="cc-stat">${IC_AN}${n} ${n === 1 ? 'análise' : 'análises'}</span>
          <span class="cc-stat">${IC_TH}${rules} ${rules === 1 ? 'regra' : 'regras'} de temp.</span>
          <a class="cc-open" href="/cliente/${slug}">Abrir cliente ${ARROW}</a>
        </div>
      </div>`;
    }

    function render(filter = '') {
      const f = filter.trim().toLowerCase();
      const list = CLIENTS.filter(c => !f || (c.name || '').toLowerCase().includes(f) || (c.slug || '').toLowerCase().includes(f));
      $('count').textContent = String(CLIENTS.length);
      $('list').innerHTML = list.length
        ? list.map(card).join('')
        : `<p class="cc-empty">${CLIENTS.length ? 'Nenhum cliente para essa busca.' : 'Nenhum cliente cadastrado ainda.'}</p>`;
    }

    async function load() {
      try {
        const [cdoc, rows] = await Promise.all([
          fetch('/api/clients').then(r => r.json()),
          fetch('/api/analyses').then(r => r.json()).catch(() => []),
        ]);
        CLIENTS = cdoc.clients || [];
        COUNTS = {};
        for (const r of (rows || [])) COUNTS[r.client] = (COUNTS[r.client] || 0) + 1;
        render($('search').value);
      } catch (e) { $('list').innerHTML = '<p class="cc-empty">Erro ao carregar.</p>'; }
    }

    $('search').addEventListener('input', (e) => render(e.target.value));

    $('save').addEventListener('click', async () => {
      const name = $('f-name').value.trim();
      if (!name) { show('err', 'Informe o nome.'); return; }
      $('save').disabled = true;
      try {
        const r = await fetch('/api/clients', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, context: $('f-ctx').value.trim() }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'falha');
        show('ok', `Salvo (${d.slug}).`);
        $('f-name').value = ''; $('f-ctx').value = '';
        load();
      } catch (e) { show('err', '⚠ ' + e.message); }
      finally { $('save').disabled = false; }
    });

    load();
  </script>
</body>
</html>
