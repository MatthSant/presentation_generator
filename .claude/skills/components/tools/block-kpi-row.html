<div class="mr">
  <div class="mi"><div class="mv {{color-1}}">{{value-1}}</div><div class="ml">{{label-1}}</div></div>
  <div class="mi"><div class="mv {{color-2}}">{{value-2}}</div><div class="ml">{{label-2}}</div></div>
  <div class="mi"><div class="mv {{color-3}}">{{value-3}}</div><div class="ml">{{label-3}}</div></div>
  <div class="mi"><div class="mv {{color-4}}">{{value-4}}</div><div class="ml">{{label-4}}</div></div>
</div>

<!--
REGRAS:
- Número de KPIs: 2 a 4. Remover <div class="mi"> excedentes.
- {{color-N}}: c-p | c-g | c-a | c-o | c-r | c-w — nunca hex inline
- {{label-N}}: texto puro ou com <br> para quebra de linha. Sem outras tags.
- {{value-N}}: texto puro (ex: "~165k", "+6,5%", "R$48M")
-->
