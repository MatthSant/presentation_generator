<!DOCTYPE html>
<html lang="pt-BR" data-theme="{{THEME}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Dark tokens (padrão) ── */
    :root, [data-theme="dark"] {
      --bg:        #0C0C0C;
      --bg-page:   #111111;
      --border:    #272727;
      --fg:        #FFFFFF;
      --gray:      #B8BEC8;
      --gray2:     #9CA3AF;
      --purple:    #8B5CF6;
      --purple-d:  #5B21B6;
      --purple-bg: rgba(139,92,246,.12);
      --green:     #10B981;
      --green-bg:  rgba(16,185,129,.12);
      --amber:     #F59E0B;
      --amber-bg:  rgba(245,158,11,.12);
      --orange:    #F97316;
      --orange-bg: rgba(249,115,22,.12);
      --red:       #EF4444;
      --red-bg:    rgba(239,68,68,.12);
      --surface:   rgba(255,255,255,.03);
      --divider:   rgba(255,255,255,.07);
    }

    /* ── Light tokens ── */
    [data-theme="light"] {
      --bg:        #F9FAFB;
      --bg-page:   #ECEEF1;
      --border:    #E5E7EB;
      --fg:        #111827;
      --gray:      #4B5563;
      --gray2:     #6B7280;
      --purple:    #7C3AED;
      --purple-d:  #EDE9FE;
      --purple-bg: rgba(124,58,237,.08);
      --green:     #059669;
      --green-bg:  rgba(5,150,105,.08);
      --amber:     #D97706;
      --amber-bg:  rgba(217,119,6,.08);
      --orange:    #EA580C;
      --orange-bg: rgba(234,88,12,.08);
      --red:       #DC2626;
      --red-bg:    rgba(220,38,38,.08);
      --surface:   rgba(0,0,0,.02);
      --divider:   rgba(0,0,0,.07);
    }

    /* ── Page ── */
    html, body {
      background: var(--bg-page);
      color: var(--fg);
      font-family: 'Exo 2', system-ui, sans-serif;
      font-size: 16px;
      min-height: 100vh;
    }

    #page-wrap {
      padding: 48px 32px 96px;
      display: flex;
      justify-content: center;
    }

    #export-root {
      width: 1000px;
      flex-shrink: 0;
      background: var(--bg);
      padding: 40px 48px;
    }

    /* ── Export button ── */
    #export-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      transition: opacity .15s, transform .1s;
      z-index: 9999;
    }
    #export-btn:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
    #export-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    /* ── Badges ── */
    .badge { display:inline-flex; align-items:center; padding:3px 11px; border-radius:100px; font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; border:1px solid; }
    .badge-p { color:var(--purple); border-color:var(--purple); }
    .badge-g { color:var(--green);  border-color:var(--green); }
    .badge-a { color:var(--amber);  border-color:var(--amber); }
    .badge-o { color:var(--orange); border-color:var(--orange); }
    .badge-r { color:var(--red);    border-color:var(--red); }

    /* ── Tipografia ── */
    h1.slide-title { font-family:'Exo 2',sans-serif; font-size:28px; font-weight:800; line-height:1.15; color:var(--fg); margin:6px 0 0; }
    h1.slide-title em { color:var(--purple); font-style:normal; }

    /* ── Cores utilitárias ── */
    .c-p { color:var(--purple); }
    .c-g { color:var(--green); }
    .c-a { color:var(--amber); }
    .c-o { color:var(--orange); }
    .c-r { color:var(--red); }
    .c-w { color:var(--fg); }

    /* ── Cards ── */
    .card { background:var(--surface); border:1px solid var(--divider); border-radius:12px; padding:16px 18px; }
    .card-title { font-size:14px; font-weight:700; margin-bottom:5px; color:var(--fg); }
    .card-body  { font-size:12.5px; color:var(--gray); line-height:1.6; }
    .cl   { border-color:rgba(139,92,246,.28); background:var(--purple-bg); }
    .cl-g { border-color:rgba(16,185,129,.28);  background:var(--green-bg); }
    .cl-a { border-color:rgba(245,158,11,.28);  background:var(--amber-bg); }
    .cl-o { border-color:rgba(249,115,22,.28);  background:var(--orange-bg); }
    .cl-r { border-color:rgba(239,68,68,.28);   background:var(--red-bg); }

    /* ── KPI Row ── */
    .mr { display:flex; border:1px solid var(--divider); border-radius:10px; overflow:hidden; flex-shrink:0; }
    .mi { flex:1; padding:12px 13px; text-align:center; border-right:1px solid var(--divider); }
    .mi:last-child { border-right:none; }
    .mv { font-size:24px; font-weight:900; margin-bottom:3px; }
    .ml { font-size:10.5px; color:var(--gray); line-height:1.4; }

    /* ── Highlights ── */
    .hl   { background:var(--purple-bg); border:1px solid rgba(139,92,246,.3); border-radius:10px; padding:12px 15px; font-size:12.5px; color:var(--fg); line-height:1.6; }
    .hl strong { color:var(--purple); }
    .hl-a { background:var(--amber-bg);  border-color:rgba(245,158,11,.3); } .hl-a strong { color:var(--amber); }
    .hl-g { background:var(--green-bg);  border-color:rgba(16,185,129,.3); } .hl-g strong { color:var(--green); }
    .hl-r { background:var(--red-bg);    border-color:rgba(239,68,68,.3);  } .hl-r strong { color:var(--red); }

    /* ── Bullets ── */
    .def-bullets { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
    .def-bullets li { font-size:12.5px; color:var(--gray); line-height:1.5; padding-left:18px; position:relative; }
    .def-bullets li::before { content:'—'; color:rgba(139,92,246,.4); position:absolute; left:0; top:0; }

    ul.bul { list-style:none; display:flex; flex-direction:column; gap:6px; padding:0; margin:0; }
    ul.bul li { display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--gray); line-height:1.5; }
    ul.bul li::before { content:''; width:5px; height:5px; background:var(--purple); border-radius:50%; margin-top:6px; flex-shrink:0; }
    ul.bul li strong { color:var(--fg); }

    /* ── Find Blocks ── */
    .find-block { padding:16px 0; border-bottom:1px solid var(--divider); }
    .find-block:last-child { border-bottom:none; }
    .find-tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:5px; display:inline-block; }
    .find-tag-p { color:var(--purple); }
    .find-tag-g { color:var(--green); }
    .find-tag-a { color:var(--amber); }
    .find-tag-r { color:var(--red); }
    .find-title { font-size:18px; font-weight:700; color:var(--fg); line-height:1.2; margin-bottom:10px; }
    .find-divider { height:1px; background:var(--divider); }

    /* ── Find Note ── */
    .find-note { font-size:12px; color:var(--gray); line-height:1.65; padding:10px 0 0 12px; }
    .find-note strong { color:var(--fg); }
    .find-note-p { border-left:2px solid rgba(139,92,246,.4); }
    .find-note-g { border-left:2px solid rgba(16,185,129,.4); }
    .find-note-a { border-left:2px solid rgba(245,158,11,.4); }
    .find-note-r { border-left:2px solid rgba(239,68,68,.4); }

    /* ── Def Steps ── */
    .def-step { display:flex; gap:18px; padding:20px 0; align-items:flex-start; border-bottom:1px solid var(--divider); }
    .def-step:last-child { border-bottom:none; }
    .def-step-num { font-size:48px; font-weight:900; line-height:1; color:rgba(139,92,246,.4); flex-shrink:0; width:48px; text-align:right; letter-spacing:-2px; }
    .def-step-body { flex:1; }
    .def-step-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--purple); margin-bottom:5px; }
    .def-step-title { font-size:18px; font-weight:700; color:var(--fg); margin-bottom:12px; line-height:1.2; }
    .def-step-stats { display:flex; gap:24px; margin-bottom:12px; }
    .def-step-stat-n { font-size:22px; font-weight:900; line-height:1; margin-bottom:3px; }
    .def-step-stat-l { font-size:10px; color:var(--gray2); text-transform:uppercase; letter-spacing:.8px; }
    .def-divider { height:1px; background:var(--divider); }

    /* ── Mdef Blocks ── */
    .mdef-block { padding:16px 0; border-bottom:1px solid var(--divider); }
    .mdef-block:last-child { border-bottom:none; }
    .mdef-tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--purple); margin-bottom:4px; }
    .mdef-title { font-size:18px; font-weight:700; color:var(--fg); margin-bottom:10px; line-height:1.2; }
    .mdef-sub-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--gray2); margin:10px 0 6px; }
    .mdef-divider { height:1px; background:var(--divider); }
    .mdef-note { font-size:11.5px; color:var(--gray2); line-height:1.6; padding:14px 16px; border-left:2px solid rgba(139,92,246,.3); }

    /* ── Grp Items ── */
    .grp-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--purple); margin-bottom:10px; }
    .grp-list  { display:flex; flex-direction:column; }
    .grp-item  { display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid var(--divider); }
    .grp-item:last-child { border-bottom:none; }
    .grp-n    { font-size:10px; font-weight:700; color:rgba(139,92,246,.45); width:18px; flex-shrink:0; }
    .grp-name { font-size:13px; font-weight:600; color:var(--fg); line-height:1.2; }
    .grp-ex   { font-size:11px; color:var(--gray2); margin-top:1px; }

    /* ── Charts ── */
    .chart-wrap { border-radius:10px; padding:4px 2px 0; }
    .chart-title { font-size:10.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--gray2); margin-bottom:3px; }

    /* ── Tabela ── */
    .tw { border-radius:10px; border:1px solid var(--border); overflow:hidden; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    [data-theme="dark"] table thead tr  { background:#5B21B6; }
    [data-theme="light"] table thead tr { background:#EDE9FE; }
    [data-theme="dark"]  table th { color:rgba(255,255,255,.9); }
    [data-theme="light"] table th { color:#6D28D9; }
    table th { padding:8px 12px; text-align:left; font-weight:700; font-size:10.5px; letter-spacing:.3px; }
    table td { padding:7px 12px; border-bottom:1px solid var(--border); color:var(--gray); }
    table tr:last-child td { border-bottom:none; }
    [data-theme="dark"]  table tr:nth-child(even) td { background:rgba(255,255,255,.02); }
    [data-theme="light"] table tr:nth-child(even) td { background:rgba(0,0,0,.02); }

    /* ── Layout ── */
    .row    { display:flex; gap:16px; }
    .col    { display:flex; flex-direction:column; gap:12px; min-width:0; }
    .g2     { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .g3     { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    .g4     { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .panel-l { flex:1.1; display:flex; flex-direction:column; gap:10px; min-width:0; }
    .panel-r { flex:.9;  display:flex; flex-direction:column; gap:10px; min-width:0; }

    /* ── Text utils ── */
    .label-sec { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--gray2); margin-bottom:5px; }
    .xs { font-size:11px; color:var(--gray2); }
    .sm { font-size:12.5px; color:var(--gray); line-height:1.6; }
    .divl { width:36px; height:3px; background:var(--purple); border-radius:2px; margin:7px 0 18px; }

    /* ── Tags ── */
    .tag   { padding:3px 9px; border-radius:5px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .tag-p { background:var(--purple-bg); color:var(--purple); }
    .tag-g { background:var(--green-bg);  color:var(--green); }
    .tag-a { background:var(--amber-bg);  color:var(--amber); }
    .tag-r { background:var(--red-bg);    color:var(--red); }
    .tag-o { background:var(--orange-bg); color:var(--orange); }

    /* ── Agenda compacta ── */
    .ai { display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--divider); border-radius:10px; padding:12px 16px; }
    .an { width:30px; height:30px; border-radius:8px; background:var(--purple-bg); color:var(--purple); font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .at { font-size:13.5px; font-weight:700; color:var(--fg); }
    .as { font-size:11px; color:var(--gray); margin-top:2px; }

    /* ── NI ── */
    .ni { display:flex; align-items:flex-start; gap:11px; background:var(--surface); border:1px solid var(--divider); border-radius:10px; padding:12px 15px; }
    .nb { width:24px; height:24px; border-radius:6px; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .nb-p { background:var(--purple); color:#fff; }
    .nb-g { background:var(--green);  color:#000; }
    .nb-r { background:var(--red);    color:#fff; }
    .nb-a { background:var(--amber);  color:#000; }
    .nt { font-size:12.5px; color:var(--gray); line-height:1.5; }
    .nt strong { color:var(--fg); }
    .ni-v { flex-direction:column; gap:0; padding:8px 12px; }
    .ni-head { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
    .ni-num { width:24px; height:24px; border-radius:6px; background:var(--purple); color:#fff; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ni-title { font-size:13px; font-weight:700; color:var(--fg); }
    .ni-section { padding-left:9px; margin-bottom:5px; }
    .ni-section:last-child { margin-bottom:0; }
    .ni-sl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; display:block; margin-bottom:2px; }
    .ni-sb { font-size:11px; color:var(--gray); line-height:1.45; }
    .ni-sl.c-a { border-left:2px solid rgba(245,158,11,.45); padding-left:6px; }
    .ni-sl.c-g { border-left:2px solid rgba(16,185,129,.45); padding-left:6px; }

    /* ── Status pills ── */
    .sp    { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
    .sp-p  { background:var(--purple); color:#fff; }
    .sp-g  { background:var(--green);  color:#000; }
    .sp-a  { background:var(--amber);  color:#000; }
    .sp-o  { background:var(--orange); color:#fff; }
    .sp-r  { background:var(--red);    color:#fff; }

    /* ── Impact badge ── */
    .impact { font-size:11px; color:var(--green); font-weight:700; background:rgba(16,185,129,.15); padding:2px 7px; border-radius:4px; }

    /* ── Slide hd (opcional, para elementos com cabeçalho de seção) ── */
    .slide-hd { margin-bottom:24px; }
    .content  { display:flex; flex-direction:column; gap:14px; }
  </style>
</head>
<body>

<button id="export-btn" disabled>↓ PNG</button>

<div id="page-wrap">
  <div id="export-root">

{{CONTENT}}

  </div>
</div>

<script>
  /* ── Chart definitions ── */
  const chartDefs = {
{{CHART_DEFS}}
  };

  /* ── ApexCharts base por tema ── */
  const isDark = document.documentElement.dataset.theme !== 'light';
  const labelColor  = isDark ? '#9CA3AF' : '#6B7280';
  const gridColor   = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.08)';
  const tooltipMode = isDark ? 'dark' : 'light';
  const defaultColors = isDark
    ? ['#8B5CF6', '#10B981', '#F59E0B', '#F97316', '#EF4444']
    : ['#7C3AED', '#059669', '#D97706', '#EA580C', '#DC2626'];

  const chartBase = {
    chart: { background: 'transparent', toolbar: { show: false }, animations: { enabled: false } },
    theme: { mode: isDark ? 'dark' : 'light' },
    grid: { borderColor: gridColor, strokeDashArray: 3 },
    tooltip: { theme: tooltipMode },
    xaxis: { labels: { style: { colors: labelColor, fontSize: '11px' } }, axisBorder: { show: false }, axisTicks: { show: false } },
    yaxis: { labels: { style: { colors: labelColor, fontSize: '11px' } } },
    dataLabels: { enabled: false },
    legend: { labels: { colors: labelColor } },
  };

  function mergeDeep(target, source) {
    for (const key of Object.keys(source)) {
      if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
        target[key] = target[key] || {};
        mergeDeep(target[key], source[key]);
      } else {
        target[key] = source[key];
      }
    }
    return target;
  }

  function buildOptions(def) {
    const base = JSON.parse(JSON.stringify(chartBase));
    const resolvedType = ['mixed', 'stacked'].includes(def.type) ? 'bar'
                       : def.type === 'bar-horizontal' ? 'bar'
                       : def.type;
    const opts = {
      chart: { ...base.chart, type: resolvedType, height: def.height },
      series: def.series,
      colors: def.colors || defaultColors,
    };

    if (def.categories) opts.xaxis = { ...base.xaxis, categories: def.categories };
    if (def.labels)     opts.labels = def.labels;

    if (def.type === 'donut' || def.type === 'pie') {
      opts.legend = { position: 'bottom', labels: { colors: labelColor } };
      opts.plotOptions = { pie: { donut: { size: '65%' } } };
    }
    if (def.type === 'bar' || def.type === 'mixed') {
      opts.plotOptions = { bar: { borderRadius: 4, columnWidth: '55%', ...(def.distributed ? { distributed: true } : {}) } };
      opts.yaxis = { ...base.yaxis, min: 0 };
    }
    if (def.type === 'stacked') {
      opts.chart.stacked = true;
      if (def.stackType) opts.chart.stackType = def.stackType;
      opts.plotOptions = { bar: { borderRadius: 3, columnWidth: '55%' } };
      opts.yaxis = { ...base.yaxis, min: 0 };
    }
    if (def.type === 'bar-horizontal') {
      opts.plotOptions = { bar: { horizontal: true, borderRadius: 3, barHeight: '60%' } };
      opts.yaxis = { labels: { style: { colors: labelColor, fontSize: '11px' } } };
      opts.xaxis = { ...base.xaxis, categories: def.categories, min: 0 };
    }
    if (def.type === 'line') {
      opts.stroke = { curve: 'smooth', width: 2.5 };
      opts.markers = { size: 4 };
      opts.yaxis = { ...base.yaxis, min: 0 };
    }
    if (def.type === 'area') {
      opts.stroke = { curve: 'smooth', width: 2 };
      opts.fill = { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.35, opacityTo: 0 } };
      opts.yaxis = { ...base.yaxis, min: 0 };
    }
    if (def.type === 'radialBar') {
      opts.chart.type = 'radialBar';
      opts.plotOptions = { radialBar: { hollow: { size: '40%' }, dataLabels: {
        name:  { color: labelColor, fontSize: '12px' },
        value: { color: isDark ? '#E5E7EB' : '#111827', fontSize: '20px', fontWeight: 700, formatter: v => v + '%' },
      }}};
      opts.legend = { show: true, position: 'bottom', labels: { colors: labelColor } };
    }
    if (def.type === 'scatter') {
      opts.chart.type = 'scatter';
      opts.markers = { size: 6 };
      opts.xaxis = { ...base.xaxis, type: 'numeric' };
      opts.yaxis = { ...base.yaxis };
    }
    if (def.type === 'radar') {
      opts.chart.type = 'radar';
      opts.stroke = { width: 2 };
      opts.fill = { opacity: 0.15 };
      opts.xaxis = { categories: def.categories, labels: { style: { colors: Array(def.categories?.length || 6).fill(labelColor), fontSize: '11px' } } };
      opts.yaxis = { show: false };
    }
    if (def.type === 'treemap') {
      opts.chart.type = 'treemap';
      opts.plotOptions = { treemap: { distributed: true, enableShades: true, shadeIntensity: 0.4 } };
      opts.legend = { show: false };
    }

    mergeDeep(opts, { chart: base.chart, grid: base.grid, tooltip: base.tooltip, dataLabels: base.dataLabels });
    if (def.options) mergeDeep(opts, def.options);
    return opts;
  }

  /* ── Render todos os gráficos ao carregar ── */
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[id^="chart-"]').forEach(el => {
      if (chartDefs[el.id] && !el._rendered) {
        el._rendered = true;
        new ApexCharts(el, buildOptions(chartDefs[el.id])).render();
      }
    });
  });

  /* ── Export PNG ── */
  const btn = document.getElementById('export-btn');

  Promise.race([
    document.fonts.ready,
    new Promise(r => setTimeout(r, 3000)),
  ]).then(() => { btn.disabled = false; });

  btn.addEventListener('click', async () => {
    const orig = btn.textContent;
    btn.textContent = '...';
    btn.disabled = true;
    try {
      const node = document.getElementById('export-root');
      const bg   = getComputedStyle(document.documentElement)
                     .getPropertyValue('--bg').trim() || '#0C0C0C';
      const canvas = await html2canvas(node, {
        scale: 3,
        backgroundColor: bg,
        useCORS: true,
        allowTaint: true,
        logging: false,
      });
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = '{{FILENAME}}.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      btn.textContent = orig;
      btn.disabled = false;
    } catch (e) {
      console.error('Export error:', e);
      btn.textContent = 'Erro ✕';
      btn.style.background = '#DC2626';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.background = '';
        btn.disabled = false;
      }, 3000);
    }
  });
</script>
</body>
</html>
