    <div class="badge badge-p">RESUMO EXECUTIVO</div>
    <h1 class="slide-title">{{título}}</h1>
  </div>
  <div class="content" style="gap:0">
    {{EXEC_POINTS}}
  </div>
</section>

<!--
EXEC_POINTS: repetir block-exec-point.html para cada claim.
Normalmente 3–4 claims por slide de resumo executivo.

Regras:
- {{título}}: action title que resume o argumento central do deck
- Cada claim deve ser independente e autoexplicativo
- Lendo só os claims em negrito, o argumento completo deve ficar claro
- Suportes são 2–3 dados que comprovam o claim — sem meta-comentários
-->
