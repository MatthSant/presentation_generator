<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <rect width="1280" height="720" fill="#0d0d10"/>
  <!-- glow roxo canto superior esquerdo -->
  <radialGradient id="gl" cx="0%" cy="0%" r="70%">
    <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#gl)"/>
  <!-- glow verde canto inferior direito -->
  <radialGradient id="gr" cx="100%" cy="100%" r="60%">
    <stop offset="0%"   stop-color="#10B981" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#gr)"/>
  <!-- dot grid por cima -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.055)"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#dots)"/>
</svg>
