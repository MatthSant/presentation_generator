<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <rect width="1280" height="720" fill="#0a0a0e"/>
  <!-- glow roxo forte — para capa e contracapa -->
  <radialGradient id="gc" cx="30%" cy="50%" r="65%">
    <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#gc)"/>
  <!-- linha de acento horizontal sutil no centro -->
  <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0"/>
    <stop offset="30%"  stop-color="#8B5CF6" stop-opacity="0.35"/>
    <stop offset="70%"  stop-color="#8B5CF6" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="359" width="1280" height="1" fill="url(#line)"/>
  <!-- dot grid por cima -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.06)"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#dots)"/>
</svg>
