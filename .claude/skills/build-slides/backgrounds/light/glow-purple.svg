<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
  <rect width="1280" height="720" fill="#FAFAFA"/>
  <!-- glow central roxo suave -->
  <radialGradient id="gp" cx="50%" cy="50%" r="58%">
    <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#gp)"/>
  <!-- dot grid -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(0,0,0,0.055)"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#dots)"/>
</svg>
