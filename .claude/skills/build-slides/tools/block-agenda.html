<div class="agenda-list">
  <div class="agenda-item">
    <span class="agenda-num {{num-color-1}}">{{num-1}}</span>
    <div class="agenda-body">
      <div class="agenda-title">{{title-1}}</div>
      <div class="agenda-sub">{{sub-1}}</div>
    </div>
  </div>
  <div class="agenda-item">
    <span class="agenda-num {{num-color-2}}">{{num-2}}</span>
    <div class="agenda-body">
      <div class="agenda-title">{{title-2}}</div>
      <div class="agenda-sub">{{sub-2}}</div>
    </div>
  </div>
  <div class="agenda-item">
    <span class="agenda-num {{num-color-3}}">{{num-3}}</span>
    <div class="agenda-body">
      <div class="agenda-title">{{title-3}}</div>
      <div class="agenda-sub">{{sub-3}}</div>
    </div>
  </div>
</div>

<!--
REGRAS:
- Adicionar ou remover <div class="agenda-item"> conforme número de itens
- {{num-N}}: número/letra exibido (ex: "M", "1", "2") — texto puro
- {{num-color-N}}: "c-p" | "c-g" | "" (vazio = branco suave padrão)
- {{title-N}}: texto puro (sem tags filhas)
- {{sub-N}}: texto puro, pode ser omitido (remover a <div class="agenda-sub">)
- O writer substitui o bloco agenda-list inteiro — número de itens pode variar
-->
