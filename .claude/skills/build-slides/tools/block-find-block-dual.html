<div class="find-block">
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <div class="find-tag find-tag-{{color-1}}" style="margin-bottom:0">{{tag-1}}</div>
    <div class="find-tag find-tag-{{color-2}}" style="margin-bottom:0">{{tag-2}}</div>
  </div>
  <div class="find-title" style="margin-top:8px">{{title}}</div>
  <ul class="def-bullets" style="margin-top:10px">
    <li><strong>{{acao-label}}:</strong> {{acao-descricao}}</li>
    <li>{{calculo}}</li>
    <li style="color:var(--gray2);font-size:10.5px">{{footnote}}</li>
  </ul>
</div>

<!--
USO PADRÃO: Potencial + Ação
  {{tag-1}} = "Potencial"   {{color-1}} = g
  {{tag-2}} = "Ação"        {{color-2}} = p

CONTEÚDO:
  {{title}}: "Descrição: <span class="c-g">~R$Xk/ano</span>"
  {{acao-label}}: "Ação"
  {{acao-descricao}}: o que fazer, para quem, quando (texto curto)
  {{calculo}}: "N × taxa% × R$ganho = resultado"
  {{footnote}}: "X%: benchmark Fonte Ano"

REGRAS:
- Este bloco é OBRIGATÓRIO em todo slide analítico que tenha hipótese identificada
- Sempre os 3 bullets: ação / cálculo / footnote de fonte
- Omitir o footnote somente se o número vier de dado interno direto (não de estimativa)
-->
