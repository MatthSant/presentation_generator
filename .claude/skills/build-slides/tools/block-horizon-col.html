<!--
  block-horizon-col.html — Coluna de horizonte para slide tipo: plano-acao
  Usar dentro de <div class="g4"> — uma coluna por horizonte temporal
  Horizontes: Imediato (r) | Curto Prazo (a) | Médio Prazo (p) | Longo Prazo (g)

  DESIGN: sem cards — itens como lista separada por linhas finas
-->
<div style="display:flex;flex-direction:column">

  <!-- cabeçalho do horizonte -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.1)">
    <div class="badge badge-{{cor}}">{{horizonte}}</div>
    <span style="font-size:10px;color:var(--gray2)">{{prazo}}</span>
  </div>

  <!-- ação — repetir para cada ação do horizonte; separar com <div style="height:1px;background:rgba(255,255,255,.05);margin:8px 0"></div> -->
  <div>
    <div style="display:flex;align-items:baseline;gap:5px;margin-bottom:4px">
      <span style="font-size:9.5px;font-weight:800;color:var(--{{id-color}});flex-shrink:0;text-transform:uppercase;letter-spacing:.5px">{{id}}</span>
      <span style="font-size:11.5px;font-weight:600;color:var(--white);line-height:1.35">{{título}}</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
      <span class="badge badge-g" style="font-size:9px;padding:2px 7px">{{impacto}}</span>
      <span style="font-size:9.5px;color:var(--gray2)">esforço {{esforço}}</span>
    </div>
    <div style="font-size:10.5px;color:var(--gray);line-height:1.45">{{racional}}</div>
  </div>
  <!-- separador entre ações: <div style="height:1px;background:rgba(255,255,255,.05);margin:8px 0"></div> -->
  <!-- /repetir -->

</div>

<!--
PLACEHOLDERS DO CABEÇALHO:
  {{cor}}       → r | a | p | g
  {{horizonte}} → "IMEDIATO" | "CURTO PRAZO" | "MÉDIO PRAZO" | "LONGO PRAZO"
  {{prazo}}     → "< 30 dias" | "1–3 meses" | "3–6 meses" | "6–12 meses"

PLACEHOLDERS POR AÇÃO:
  {{id}}        → A1, A2, C1, M1, L1 — prefixo indica horizonte
  {{id-color}}  → red | amber | purple | green (sem var(--)
  {{título}}    → descrição curta e acionável
  {{impacto}}   → "~R$1,6M/ano" | "não estimado"
  {{esforço}}   → "baixo" | "médio" | "alto"
  {{racional}}  → 1 frase com dado da análise

CORES POR HORIZONTE (id-color):
  Imediato    → badge-r  | id-color: red
  Curto Prazo → badge-a  | id-color: amber
  Médio Prazo → badge-p  | id-color: purple
  Longo Prazo → badge-g  | id-color: green

CONTAINER:
  <div class="g4">
    [block-horizon-col × 4]
  </div>

REGRA: máx 3 ações por coluna. Excedente vai para slide de detalhe com block-ni.html.
-->
