<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gráficos — Conhecimento dos Cursos e Webinário</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; padding:40px 32px; background:#0C0C14; font-family:'Exo 2',system-ui,sans-serif; color:#F1F5F9; }
    .page { max-width:860px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
    .chart-card { background:#161624; border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:24px 28px 12px; }
    .card-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:8px; }
    .card-title { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#64748B; }
    .legend { display:flex; gap:18px; }
    .legend-item { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:#94A3B8; }
    .legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  </style>
</head>
<body>
<div class="page">

  <div class="chart-card">
    <div class="card-header">
      <div class="card-title">Taxa de conversão por conhecimento dos cursos — Sem vs. Com Webinário</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#475569"></div>Sem Webinário</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8B5CF6"></div>Com Webinário</div>
      </div>
    </div>
    <div id="chart-conversao"></div>
  </div>

  <div class="chart-card">
    <div class="card-header">
      <div class="card-title">Volume de leads por conhecimento dos cursos — Sem vs. Com Webinário</div>
    </div>
    <div id="chart-leads"></div>
  </div>

</div>
<script>
  const categories = ['Sem resposta', 'Pensa em fazer', 'Fará com certeza', 'Sem interesse', 'Nunca ouviu / não quer', 'Nunca ouviu / quer conhecer'];

  const base = {
    chart: { background:'transparent', toolbar:{ show:false }, animations:{ enabled:false }, fontFamily:'Exo 2, system-ui, sans-serif' },
    grid: { borderColor:'rgba(255,255,255,.06)', strokeDashArray:4, xaxis:{ lines:{ show:true } }, yaxis:{ lines:{ show:false } } },
    tooltip: { theme:'dark' },
    legend: { show:false },
    plotOptions: { bar:{ horizontal:true, borderRadius:5, barHeight:'52%' } },
    xaxis: { axisBorder:{ show:false }, axisTicks:{ show:false }, labels:{ style:{ colors:'#64748B', fontSize:'11px', fontFamily:'Exo 2, sans-serif', fontWeight:600 } } },
    yaxis: { labels:{ style:{ colors:'#94A3B8', fontSize:'12px', fontFamily:'Exo 2, sans-serif', fontWeight:600 } } },
  };

  new ApexCharts(document.getElementById('chart-conversao'), {
    ...base,
    chart: { ...base.chart, type:'bar', height:360 },
    series: [
      { name:'Sem Webinário', data:[3.39, 2.52, 2.72, 0.91, 0.59, 0.00] },
      { name:'Com Webinário', data:[14.29, 13.79, 0.00, 5.88, 0.00, 0.00] },
    ],
    colors: ['#475569','#8B5CF6'],
    xaxis: {
      ...base.xaxis, categories, min:0, max:18,
      labels: { ...base.xaxis.labels, formatter: v => v.toFixed(0)+'%' },
    },
    dataLabels: {
      enabled: true,
      formatter: v => v > 0 ? v.toFixed(1)+'%' : '',
      style: { fontSize:'11px', fontWeight:700, fontFamily:'Exo 2, sans-serif', colors:['#fff'] },
      dropShadow: { enabled:false },
      offsetX: -4,
    },
    tooltip: { theme:'dark', y:{ formatter: v => v.toFixed(2)+'%' } },
    annotations: {
      xaxis: [{ x:2.94, strokeDashArray:5, borderColor:'#F59E0B', borderWidth:1.5,
        label:{ text:'Média 2,94%', position:'top', orientation:'horizontal', offsetY:-6,
          style:{ color:'#F59E0B', background:'transparent', fontSize:'10px', fontWeight:700, fontFamily:'Exo 2, sans-serif', padding:{ top:0, bottom:0, left:4, right:4 } } } }],
    },
  }).render();

  new ApexCharts(document.getElementById('chart-leads'), {
    ...base,
    chart: { ...base.chart, type:'bar', stacked:true, height:330 },
    series: [
      { name:'Sem Webinário', data:[797, 397, 147, 441, 169, 144] },
      { name:'Com Webinário', data:[28, 29, 15, 17, 4, 3] },
    ],
    colors: ['#475569','#8B5CF6'],
    xaxis: {
      ...base.xaxis, categories, min:0,
      labels: { ...base.xaxis.labels, formatter: v => v },
    },
    dataLabels: {
      enabled: true,
      enabledOnSeries: [0],
      formatter: (v, opts) => opts.w.globals.stackedSeriesTotals[opts.dataPointIndex] + ' leads',
      style: { fontSize:'11px', fontWeight:700, fontFamily:'Exo 2, sans-serif', colors:['#fff'] },
      dropShadow: { enabled:false },
      offsetX: -8,
    },
    tooltip: { theme:'dark', y:{ formatter: v => v+' leads' } },
    legend: {
      show:true, position:'bottom',
      labels:{ colors:'#94A3B8' }, fontFamily:'Exo 2, sans-serif', fontSize:'11.5px', fontWeight:600,
      markers:{ width:10, height:10, radius:3 }, itemMargin:{ horizontal:12 },
    },
  }).render();
</script>
</body>
</html>
