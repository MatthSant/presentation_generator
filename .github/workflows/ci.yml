# CI do app de analytics — lint + build TS + suíte hermética (sem Python/API).
name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 (LTS), não 20: o `npm test` passa um GLOB p/ o `node --test`
          # ("test/**/*.test.ts") e isso só existe do Node 21+ — no 20 o padrão vira
          # caminho literal e a suíte inteira falha com "Could not find".
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
